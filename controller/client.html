<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story 파일 업로드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e9ecef;
            border-color: #764ba2;
        }

        .file-input-label.dragover {
            background: #e7f3ff;
            border-color: #667eea;
        }

        .file-input-label-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .file-input-label-text {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .file-input-label-hint {
            font-size: 0.9em;
            color: #666;
        }

        input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-list {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .file-item {
            position: relative;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .file-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .file-info {
            padding: 10px;
        }

        .file-name {
            font-size: 0.85em;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .file-size {
            font-size: 0.75em;
            color: #666;
        }

        .file-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .file-remove:hover {
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .file-count {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9em;
        }

        .file-count.warning {
            color: #dc3545;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Story 파일 업로드</h1>
        
        <div class="upload-section">
            <div class="file-input-wrapper">
                <label for="fileInput" class="file-input-label" id="fileInputLabel">
                    <div class="file-input-label-icon">📁</div>
                    <div class="file-input-label-text">파일을 선택하거나 드래그하세요</div>
                    <div class="file-input-label-hint">이미지 (JPG, PNG, GIF, WEBP) 또는 동영상 (MP4)<br>최대 5개, 각 파일 최대 5MB</div>
                </label>
                <input 
                    type="file" 
                    id="fileInput" 
                    multiple 
                    accept="image/jpeg,image/jpg,image/png,image/gif,image/webp,video/mp4"
                />
            </div>

            <div class="file-count" id="fileCount"></div>

            <div class="file-list" id="fileList"></div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="controls">
            <button id="uploadBtn" onclick="uploadFiles()" disabled>업로드</button>
            <button class="btn-clear" onclick="clearFiles()">전체 삭제</button>
            <button onclick="testConnection()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">연결 테스트</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let selectedFiles = [];
        const maxFiles = 5;
        const maxFileSize = 5 * 1024 * 1024; // 5MB

        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const fileInputLabel = document.getElementById('fileInputLabel');

        // 파일 크기 포맷팅 함수
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // 파일 타입 확인 함수
        function isImageFile(file) {
            return file.type.startsWith('image/');
        }

        // 파일 미리보기 생성
        function createFilePreview(file, index) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.dataset.index = index;

            const preview = document.createElement('div');
            preview.style.position = 'relative';
            preview.style.width = '100%';
            preview.style.height = '150px';
            preview.style.background = '#000';
            preview.style.display = 'flex';
            preview.style.alignItems = 'center';
            preview.style.justifyContent = 'center';
            preview.style.color = '#fff';
            preview.style.fontSize = '2em';

            if (isImageFile(file)) {
                const img = document.createElement('img');
                img.className = 'file-preview';
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            } else {
                preview.textContent = '🎬';
            }

            const removeBtn = document.createElement('button');
            removeBtn.className = 'file-remove';
            removeBtn.textContent = '×';
            removeBtn.onclick = () => removeFile(index);
            preview.appendChild(removeBtn);

            const fileInfo = document.createElement('div');
            fileInfo.className = 'file-info';
            
            const fileName = document.createElement('div');
            fileName.className = 'file-name';
            fileName.textContent = file.name;
            
            const fileSize = document.createElement('div');
            fileSize.className = 'file-size';
            fileSize.textContent = formatFileSize(file.size);

            fileInfo.appendChild(fileName);
            fileInfo.appendChild(fileSize);

            fileItem.appendChild(preview);
            fileItem.appendChild(fileInfo);

            return fileItem;
        }

        // 파일 목록 업데이트
        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const preview = createFilePreview(file, index);
                fileList.appendChild(preview);
            });

            // 파일 개수 업데이트
            const count = selectedFiles.length;
            fileCount.textContent = `선택된 파일: ${count} / ${maxFiles}`;
            if (count >= maxFiles) {
                fileCount.classList.add('warning');
                fileInput.disabled = true;
            } else {
                fileCount.classList.remove('warning');
                fileInput.disabled = false;
            }

            // 업로드 버튼 활성화/비활성화
            uploadBtn.disabled = count === 0;
        }

        // 파일 제거
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // 파일 선택 처리
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 드래그 앤 드롭 처리
        fileInputLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileInputLabel.classList.add('dragover');
        });

        fileInputLabel.addEventListener('dragleave', () => {
            fileInputLabel.classList.remove('dragover');
        });

        fileInputLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileInputLabel.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // 파일 처리 함수
        function handleFiles(files) {
            const remainingSlots = maxFiles - selectedFiles.length;
            
            if (remainingSlots <= 0) {
                showStatus('최대 5개의 파일만 업로드할 수 있습니다.', 'error');
                return;
            }

            const filesToAdd = Array.from(files).slice(0, remainingSlots);
            const allowedTypes = [
                'image/jpeg', 'image/jpg', 'image/png', 
                'image/gif', 'image/webp', 'video/mp4'
            ];

            for (const file of filesToAdd) {
                // 파일 타입 확인
                if (!allowedTypes.includes(file.type)) {
                    showStatus(`파일 "${file.name}"은(는) 지원되지 않는 형식입니다.`, 'error');
                    continue;
                }

                // 파일 크기 확인
                if (file.size > maxFileSize) {
                    showStatus(`파일 "${file.name}"은(는) 5MB를 초과합니다.`, 'error');
                    continue;
                }

                selectedFiles.push(file);
            }

            updateFileList();
            
            if (selectedFiles.length > 0) {
                showStatus(`${selectedFiles.length}개의 파일이 선택되었습니다.`, 'info');
            }
        }

        // 전체 파일 삭제
        function clearFiles() {
            selectedFiles = [];
            fileInput.value = '';
            updateFileList();
            hideStatus();
        }

        // 상태 메시지 표시
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status active ${type}`;
            setTimeout(() => {
                hideStatus();
            }, 5000);
        }

        function hideStatus() {
            status.classList.remove('active');
        }

        // 파일 업로드
        async function uploadFiles() {
            if (selectedFiles.length === 0) {
                showStatus('업로드할 파일이 없습니다.', 'error');
                return;
            }

            // FormData 생성
            const formData = new FormData();
            selectedFiles.forEach((file) => {
                formData.append('files', file);
            });

            // UI 업데이트
            uploadBtn.disabled = true;
            progressBar.classList.add('active');
            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            hideStatus();

            try {
                // XMLHttpRequest를 사용하여 업로드 진행률 표시
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressFill.style.width = percentComplete + '%';
                        progressFill.textContent = Math.round(percentComplete) + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    console.log('Response status:', xhr.status);
                    console.log('Response headers:', xhr.getAllResponseHeaders());
                    console.log('Response text:', xhr.responseText);
                    
                    if (xhr.status === 200) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            console.log('Success response:', response);
                            showStatus('파일 업로드가 완료되었습니다!', 'success');
                            progressFill.style.width = '100%';
                            progressFill.textContent = '100%';
                            
                            // 성공 후 파일 목록 초기화
                            setTimeout(() => {
                                clearFiles();
                                progressBar.classList.remove('active');
                            }, 2000);
                        } catch (e) {
                            console.error('Response parsing error:', e);
                            showStatus('업로드 완료 (응답 파싱 실패)', 'success');
                            progressBar.classList.remove('active');
                            setTimeout(() => {
                                clearFiles();
                            }, 2000);
                        }
                    } else {
                        // 에러 응답 처리
                        let errorMessage = '알 수 없는 오류가 발생했습니다.';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            
                            // 다양한 응답 형식 처리
                            if (response.desc) {
                                // SimpleError 형식: {result, resultString, desc}
                                errorMessage = response.desc;
                            } else if (response.error) {
                                // RespError 형식: {error: "..."}
                                errorMessage = response.error;
                            } else if (response.message) {
                                // 일반 메시지 형식
                                errorMessage = response.message;
                            } else if (typeof response === 'string') {
                                // 문자열 응답
                                errorMessage = response;
                            } else {
                                errorMessage = JSON.stringify(response);
                            }
                        } catch (e) {
                            // JSON 파싱 실패 시 원본 응답 텍스트 사용
                            const responseText = xhr.responseText || xhr.statusText;
                            errorMessage = `서버 오류 (${xhr.status}): ${responseText || '응답을 받을 수 없습니다'}`;
                        }
                        
                        showStatus(`업로드 실패: ${errorMessage}`, 'error');
                        progressBar.classList.remove('active');
                    }
                    uploadBtn.disabled = false;
                });

                xhr.addEventListener('error', (e) => {
                    console.error('Network error:', e);
                    console.error('Request failed. Check if server is running on http://localhost:8080');
                    showStatus('네트워크 오류가 발생했습니다. 서버 연결을 확인해주세요. (콘솔 확인)', 'error');
                    progressBar.classList.remove('active');
                    uploadBtn.disabled = false;
                });

                xhr.addEventListener('abort', () => {
                    showStatus('업로드가 취소되었습니다.', 'error');
                    progressBar.classList.remove('active');
                    uploadBtn.disabled = false;
                });

                // xhr.open('POST', 'http://localhost:8080/story/v01/upload');
                xhr.open('POST', 'http://127.0.0.1:8080/story/v01/upload');
                
                // X-Totp 헤더 추가 (liteAuth 미들웨어용, 선택적)
                // 주의: 커스텀 헤더를 추가하면 CORS preflight 요청이 발생합니다
                xhr.setRequestHeader('X-Totp', 'test');
                
                // Content-Type은 설정하지 않음 (브라우저가 multipart/form-data로 자동 설정)
                // xhr.setRequestHeader('Content-Type', 'multipart/form-data'); // 이렇게 하면 안됨!
                
                // 디버깅을 위한 로깅
                console.log('Uploading files:', selectedFiles.map(f => ({ name: f.name, size: f.size, type: f.type })));
                console.log('Request URL:', 'http://localhost:8080/story/v01/upload');
                console.log('Request method: POST');
                console.log('Total size:', selectedFiles.reduce((sum, f) => sum + f.size, 0), 'bytes');
                
                // 요청 전송
                xhr.send(formData);
                console.log('Request sent, waiting for response...');

            } catch (error) {
                console.error('Upload error:', error);
                showStatus('업로드 중 오류가 발생했습니다: ' + (error.message || error.toString()), 'error');
                progressBar.classList.remove('active');
                uploadBtn.disabled = false;
            }
        }

        // 연결 테스트 함수
        async function testConnection() {
            showStatus('서버 연결 테스트 중...', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/test', {
                    method: 'GET',
                    headers: {
                        'X-Totp': 'test'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showStatus('서버 연결 성공! 서버가 정상적으로 동작 중입니다.', 'success');
                    console.log('Connection test successful:', data);
                } else {
                    showStatus(`서버 응답 오류: ${response.status} ${response.statusText}`, 'error');
                    console.error('Connection test failed:', response.status, response.statusText);
                }
            } catch (error) {
                showStatus(`연결 실패: ${error.message}. 서버가 실행 중인지 확인하세요.`, 'error');
                console.error('Connection test error:', error);
            }
        }

        // 초기화
        updateFileList();
        
        // 페이지 로드 시 연결 테스트 (선택적)
        // testConnection();
    </script>
</body>
</html>
