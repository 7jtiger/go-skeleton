<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .video-section {
            display: none;
            gap: 20px;
            margin-top: 30px;
        }

        .video-section.active {
            display: flex;
            flex-wrap: wrap;
        }

        .video-container {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }

        /* 채팅 섹션 스타일 */
        .chat-section {
            display: none;
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chat-section.active {
            display: flex;
        }

        .chat-header {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }

        .chat-message.received {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
        }

        .chat-message .sender {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .chat-message .text {
            font-size: 1em;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chat-send-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .video-section {
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.8em;
            }

            .chat-message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 WebRTC Video Chat</h1>
        
        <div class="login-section" id="loginSection">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="이름을 입력하세요" />
                <input type="text" id="roomInput" placeholder="방 이름을 입력하세요" />
                <button id="joinBtn" onclick="joinRoom()">입장</button>
            </div>
        </div>

        <div class="video-section" id="videoSection">
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">내 화면</div>
            </div>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">상대방 화면</div>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <button onclick="toggleAudio()">🎤 음소거</button>
            <button onclick="toggleVideo()">📹 비디오 끄기</button>
            <button onclick="leaveRoom()" style="background: #dc3545;">🚪 나가기</button>
        </div>

        <!-- 채팅 섹션 -->
        <div class="chat-section" id="chatSection">
            <div class="chat-header">💬 채팅</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-group">
                <input 
                    type="text" 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="메시지를 입력하세요..."
                    onkeypress="handleChatKeyPress(event)"
                />
                <button class="chat-send-btn" onclick="sendChatMessage()">전송</button>
            </div>
        </div>

        <div class="status disconnected" id="status">서버에 연결되지 않음</div>
    </div>

    <script>
        let socket;
        let localStream;
        let peerConnection;
        let userName;
        let roomName;
        let isAudioEnabled = true;
        let isVideoEnabled = true;

        // STUN 서버 설정 (구글의 공개 STUN 서버 사용)
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // 상태 업데이트 함수
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // 방 입장 함수
        async function joinRoom() {
            userName = document.getElementById('nameInput').value.trim();
            roomName = document.getElementById('roomInput').value.trim();

            if (!userName || !roomName) {
                alert('이름과 방 이름을 모두 입력해주세요.');
                return;
            }

            try {
                // 로컬 미디어 스트림 가져오기 (카메라와 마이크)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                // 로컬 비디오 요소에 스트림 연결
                document.getElementById('localVideo').srcObject = localStream;

                // WebSocket 연결 (서버 주소를 적절히 수정하세요)
                socket = new WebSocket('ws://localhost:8080/vdchat/v01/ws');

                socket.onopen = () => {
                    console.log('WebSocket connected');
                    updateStatus('서버에 연결됨', 'connected');
                    
                    // 방 입장 메시지 전송
                    socket.send(JSON.stringify({
                        type: 'join',
                        data: { name: userName, room: roomName }
                    }));

                    // UI 업데이트
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('videoSection').classList.add('active');
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('chatSection').classList.add('active');
                    updateStatus(`방 "${roomName}"에 입장했습니다. 상대방을 기다리는 중...`, 'waiting');
                };

                socket.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    console.log('Received message:', message.type, message);

                    switch (message.type) {
                        case 'start':
                            // 두 번째 사용자가 들어왔을 때 offer 생성
                            console.log('Start signal received, creating offer...');
                            await createOffer();
                            break;
                        
                        case 'offer':
                            // offer를 받으면 answer 생성
                            console.log('Offer received, creating answer...');
                            await handleOffer(message.data);
                            break;
                        
                        case 'answer':
                            // answer를 받으면 연결 완료
                            console.log('Answer received, setting remote description...');
                            await handleAnswer(message.data);
                            break;
                        
                        case 'ice_candidate':
                            // ICE candidate 추가
                            console.log('ICE candidate received');
                            await handleIceCandidate(message.data);
                            break;
                        
                        case 'chat':
                            // 채팅 메시지 수신
                            displayChatMessage(message.data.sender, message.data.message, false);
                            break;
                    }
                };

                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateStatus('연결 오류 발생', 'disconnected');
                };

                socket.onclose = () => {
                    console.log('WebSocket disconnected');
                    updateStatus('서버 연결 끊김', 'disconnected');
                };

            } catch (error) {
                console.error('Error accessing media devices:', error);
                alert('카메라나 마이크에 접근할 수 없습니다. 권한을 확인해주세요.');
            }
        }

        // PeerConnection 생성 함수
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            // 로컬 스트림의 모든 트랙을 피어 연결에 추가
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // 원격 스트림 수신 시 처리
            peerConnection.ontrack = (event) => {
                console.log('Received remote track');
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = event.streams[0];
                updateStatus('연결 완료! 통화 중...', 'connected');
            };

            // ICE candidate 생성 시 서버로 전송
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('Sending ICE candidate');
                    socket.send(JSON.stringify({
                        type: 'ice_candidate',
                        data: { candidate: event.candidate }
                    }));
                }
            };

            // 연결 상태 변경 모니터링
            peerConnection.onconnectionstatechange = () => {
                console.log('Connection state:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'connected') {
                    updateStatus('연결 완료! 통화 중...', 'connected');
                } else if (peerConnection.connectionState === 'disconnected') {
                    updateStatus('연결이 끊어졌습니다', 'disconnected');
                }
            };
        }

        // Offer 생성 및 전송
        async function createOffer() {
            try {
                console.log('Creating offer...');
                createPeerConnection();
                console.log('PeerConnection created for offer');

                const offer = await peerConnection.createOffer();
                console.log('Offer created:', offer);
                await peerConnection.setLocalDescription(offer);
                console.log('Local description set (offer)');

                socket.send(JSON.stringify({
                    type: 'offer',
                    data: { offer: offer }
                }));
                console.log('Offer sent to server');
            } catch (error) {
                console.error('Error creating offer:', error);
            }
        }

        // Offer 처리 및 Answer 생성
        async function handleOffer(data) {
            try {
                console.log('Handling offer...', data);
                createPeerConnection();
                console.log('PeerConnection created for answer');

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                console.log('Remote description set (offer)');
                
                const answer = await peerConnection.createAnswer();
                console.log('Answer created:', answer);
                await peerConnection.setLocalDescription(answer);
                console.log('Local description set (answer)');

                socket.send(JSON.stringify({
                    type: 'answer',
                    data: { answer: answer }
                }));
                console.log('Answer sent to server');
            } catch (error) {
                console.error('Error handling offer:', error);
            }
        }

        // Answer 처리
        async function handleAnswer(data) {
            try {
                console.log('Handling answer...', data);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                console.log('Remote description set (answer)');
            } catch (error) {
                console.error('Error handling answer:', error);
            }
        }

        // ICE Candidate 처리
        async function handleIceCandidate(data) {
            try {
                if (!peerConnection) {
                    console.log('PeerConnection not ready, ignoring ICE candidate');
                    return;
                }
                
                console.log('Adding ICE candidate');
                if (data.candidate) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    console.log('ICE candidate added successfully');
                }
            } catch (error) {
                console.error('Error adding ICE candidate:', error);
            }
        }

        // 오디오 토글
        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            localStream.getAudioTracks()[0].enabled = isAudioEnabled;
            event.target.textContent = isAudioEnabled ? '🎤 음소거' : '🎤 음소거 해제';
        }

        // 비디오 토글
        function toggleVideo() {
            isVideoEnabled = !isVideoEnabled;
            localStream.getVideoTracks()[0].enabled = isVideoEnabled;
            event.target.textContent = isVideoEnabled ? '📹 비디오 끄기' : '📹 비디오 켜기';
        }

        // 채팅 메시지 표시 함수
        function displayChatMessage(sender, message, isSent) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isSent ? 'sent' : 'received'}`;
            
            if (!isSent) {
                const senderDiv = document.createElement('div');
                senderDiv.className = 'sender';
                senderDiv.textContent = sender;
                messageDiv.appendChild(senderDiv);
            }
            
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.textContent = message;
            messageDiv.appendChild(textDiv);
            
            chatMessages.appendChild(messageDiv);
            
            // 자동 스크롤 (최신 메시지로)
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 채팅 메시지 전송 함수
        function sendChatMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            
            if (!message) {
                return;
            }
            
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert('서버에 연결되어 있지 않습니다.');
                return;
            }
            
            // 서버로 메시지 전송
            socket.send(JSON.stringify({
                type: 'chat',
                data: { message: message }
            }));
            
            // 내가 보낸 메시지 표시
            displayChatMessage('나', message, true);
            
            // 입력창 초기화
            chatInput.value = '';
            chatInput.focus();
        }

        // Enter 키로 메시지 전송
        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        // 방 나가기
        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            if (socket) {
                socket.close();
            }

            // UI 초기화
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('videoSection').classList.remove('active');
            document.getElementById('controls').style.display = 'none';
            document.getElementById('chatSection').classList.remove('active');
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatInput').value = '';
            updateStatus('서버에 연결되지 않음', 'disconnected');
        }

        // 페이지 종료 시 정리
        window.addEventListener('beforeunload', () => {
            leaveRoom();
        });
    </script>
</body>
</html>
