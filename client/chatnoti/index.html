<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 대기방 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .login-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            min-width: 100px;
            font-weight: bold;
            color: #333;
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .status-section {
            padding: 20px;
            background: #e8f4f8;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }

        .waiting-room {
            display: none;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .waiting-room.active {
            display: block;
        }

        .user-list {
            margin-top: 15px;
        }

        .user-item {
            padding: 10px;
            background: white;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-section {
            display: none;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .chat-section.active {
            display: block;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 70%;
        }

        .message.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message.received {
            background: #e0e0e0;
            color: #333;
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            max-width: 100%;
            text-align: center;
            font-style: italic;
        }

        .message-header {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .message-content {
            word-wrap: break-word;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input-group input {
            flex: 1;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
            min-width: 300px;
        }

        .notification.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }

        .notification-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .notification-buttons button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .notification-buttons button.accept {
            background: #28a745;
        }

        .notification-buttons button.reject {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>채팅 대기방 테스트</h1>

        <!-- 로그인 섹션 -->
        <div class="login-section" id="loginSection">
            <div class="input-group">
                <label>사용자 ID:</label>
                <input type="text" id="userIdInput" placeholder="예: user1" value="user1">
            </div>
            <div class="input-group">
                <label>서버 주소:</label>
                <input type="text" id="serverInput" placeholder="ws://localhost:8080" value="ws://localhost:8080">
            </div>
            <button onclick="connect()">대기방 접속</button>
        </div>

        <!-- 상태 섹션 -->
        <div class="status-section">
            <div class="status disconnected" id="status">연결 안됨</div>
            <div id="statusMessage">대기방에 접속하세요.</div>
        </div>

        <!-- 대기방 섹션 -->
        <div class="waiting-room" id="waitingRoom">
            <h2>대기방</h2>
            <div class="input-group">
                <label>상대방 ID:</label>
                <input type="text" id="targetUserId" placeholder="채팅할 상대방 ID 입력">
                <button onclick="sendChatRequest()">채팅 요청</button>
            </div>
            <div class="user-list" id="userList">
                <p>대기 중인 사용자 목록이 여기에 표시됩니다.</p>
            </div>
        </div>

        <!-- 채팅 섹션 -->
        <div class="chat-section" id="chatSection">
            <h2>텍스트 채팅</h2>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-group">
                <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <!-- 알림 팝업 -->
    <div class="notification" id="notification">
        <div class="notification-header" id="notificationTitle">알림</div>
        <div id="notificationMessage"></div>
        <div class="notification-buttons" id="notificationButtons"></div>
    </div>

    <script>
        let ws = null;
        let currentUserId = '';
        let currentRoomId = '';
        let chatPartnerId = '';

        // WebSocket 연결
        function connect() {
            const userId = document.getElementById('userIdInput').value.trim();
            const server = document.getElementById('serverInput').value.trim();

            if (!userId) {
                alert('사용자 ID를 입력하세요.');
                return;
            }

            if (!server) {
                alert('서버 주소를 입력하세요.');
                return;
            }

            currentUserId = userId;

            // WebSocket 연결 (채팅 WebSocket)
            const wsUrl = `${server}/chat/v01/ws?userId=${userId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus('연결됨', 'connected', '대기방에 접속했습니다.');
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('waitingRoom').classList.add('active');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('Received message:', message);
                handleMessage(message);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('연결 오류', 'disconnected', '연결 중 오류가 발생했습니다.');
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                updateStatus('연결 끊김', 'disconnected', '연결이 끊어졌습니다.');
                document.getElementById('waitingRoom').classList.remove('active');
                document.getElementById('chatSection').classList.remove('active');
            };
        }

        // 메시지 처리
        function handleMessage(message) {
            switch (message.type) {
                case 'call-request':
                    handleCallRequest(message);
                    break;
                case 'call-accept':
                    handleCallAccept(message);
                    break;
                case 'call-reject':
                    handleCallReject(message);
                    break;
                case 'text-message':
                    handleTextMessage(message);
                    break;
                default:
                    console.log('Unknown message type:', message.type);
            }
        }

        // 통화 요청 처리
        function handleCallRequest(message) {
            showNotification(
                '채팅 요청',
                `${message.from}님이 채팅을 요청했습니다.`,
                [
                    { text: '수락', class: 'accept', onclick: () => acceptChatRequest(message) },
                    { text: '거절', class: 'reject', onclick: () => rejectChatRequest(message) }
                ]
            );
        }

        // 통화 수락 처리
        function handleCallAccept(message) {
            if (message.from === chatPartnerId) {
                currentRoomId = message.roomId;
                document.getElementById('waitingRoom').classList.remove('active');
                document.getElementById('chatSection').classList.add('active');
                addSystemMessage('채팅이 시작되었습니다.');
            }
        }

        // 통화 거절 처리
        function handleCallReject(message) {
            addSystemMessage(`${message.from}님이 채팅 요청을 거절했습니다.`);
        }

        // 텍스트 메시지 처리
        function handleTextMessage(message) {
            if (message.roomId === currentRoomId) {
                addMessage(message.from, message.content, false);
            }
        }

        // 채팅 요청 전송
        function sendChatRequest() {
            const targetUserId = document.getElementById('targetUserId').value.trim();
            if (!targetUserId) {
                alert('상대방 ID를 입력하세요.');
                return;
            }

            // 채팅방 생성
            createChatRoom(targetUserId);
        }

        // 채팅방 생성
        async function createChatRoom(targetUserId) {
            const server = document.getElementById('serverInput').value.trim();
            const httpUrl = server.replace('ws://', 'http://').replace('wss://', 'https://');

            try {
                const response = await fetch(`${httpUrl}/chat/v01/room`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roomName: `Chat with ${targetUserId}`,
                        userId: currentUserId,
                        isPrivate: true
                    })
                });

                const data = await response.json();
                if (data.result === 0 && data.data) {
                    currentRoomId = data.data.roomId;
                    chatPartnerId = targetUserId;

                    // 채팅 요청 메시지 전송
                    const requestMessage = {
                        type: 'call-request',
                        from: currentUserId,
                        to: targetUserId,
                        roomId: currentRoomId,
                        content: JSON.stringify({ callType: 'text' }),
                        timestamp: Math.floor(Date.now() / 1000)
                    };

                    ws.send(JSON.stringify(requestMessage));
                    addSystemMessage(`${targetUserId}님에게 채팅 요청을 보냈습니다.`);
                } else {
                    alert('채팅방 생성 실패: ' + (data.desc || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('Error creating chat room:', error);
                alert('채팅방 생성 중 오류가 발생했습니다.');
            }
        }

        // 채팅 요청 수락
        function acceptChatRequest(message) {
            chatPartnerId = message.from;
            currentRoomId = message.roomId;

            // 수락 메시지 전송
            const acceptMessage = {
                type: 'call-accept',
                from: currentUserId,
                to: message.from,
                roomId: message.roomId,
                content: 'accepted',
                timestamp: Math.floor(Date.now() / 1000)
            };

            ws.send(JSON.stringify(acceptMessage));

            // 채팅 화면 표시
            document.getElementById('waitingRoom').classList.remove('active');
            document.getElementById('chatSection').classList.add('active');
            addSystemMessage('채팅이 시작되었습니다.');

            hideNotification();
        }

        // 채팅 요청 거절
        function rejectChatRequest(message) {
            const rejectMessage = {
                type: 'call-reject',
                from: currentUserId,
                to: message.from,
                roomId: message.roomId,
                content: 'rejected',
                timestamp: Math.floor(Date.now() / 1000)
            };

            ws.send(JSON.stringify(rejectMessage));
            addSystemMessage(`${message.from}님의 채팅 요청을 거절했습니다.`);
            hideNotification();
        }

        // 메시지 전송
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();

            if (!content) {
                return;
            }

            if (!currentRoomId || !chatPartnerId) {
                alert('채팅 상대방이 없습니다.');
                return;
            }

            const message = {
                type: 'text-message',
                from: currentUserId,
                to: chatPartnerId,
                roomId: currentRoomId,
                content: content,
                timestamp: Math.floor(Date.now() / 1000)
            };

            ws.send(JSON.stringify(message));
            addMessage(currentUserId, content, true);
            messageInput.value = '';
        }

        // 키보드 이벤트 처리
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 메시지 추가
        function addMessage(from, content, isSent) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;

            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = `${from} ${new Date().toLocaleTimeString()}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 시스템 메시지 추가
        function addSystemMessage(content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 상태 업데이트
        function updateStatus(status, className, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = status;
            statusDiv.className = `status ${className}`;
            document.getElementById('statusMessage').textContent = message || '';
        }

        // 알림 표시
        function showNotification(title, message, buttons) {
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationMessage').textContent = message;

            const buttonsDiv = document.getElementById('notificationButtons');
            buttonsDiv.innerHTML = '';
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.textContent = btn.text;
                button.className = btn.class;
                button.onclick = btn.onclick;
                buttonsDiv.appendChild(button);
            });

            document.getElementById('notification').classList.add('show');
        }

        // 알림 숨기기
        function hideNotification() {
            document.getElementById('notification').classList.remove('show');
        }
    </script>
</body>
</html>
