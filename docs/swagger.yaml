  /story/v01/buy/{idx}:
    post:
      consumes:
      - application/json
      description: |-
        **요청**: path idx는 양의 스토리 인덱스입니다. body는 사용하지 않습니다.

        **처리**: 구매자는 JWT UID입니다. 타인의 유료 공개(stat=2) 글만 요청할 수 있으며 양방향 차단을 검사합니다.
        현재 결제 없는 완료 정책으로 psc_stat=1, qt_payed=0을 저장하여 열람 권한을 부여합니다. 결제 및 포인트 차감은 수행하지 않습니다.
        기존 대기(0) 요청은 재요청 시 완료(1)로 변경합니다. 완료 요청은 중복 저장하지 않으며 취소·회수 상태는 409로 거절합니다.

        **응답 data**: msg=ok, psc_stat=1. HTTP 200으로 반환합니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 구매 요청할 스토리 인덱스
        in: path
        name: idx
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 구매 완료
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  properties:
                    msg:
                      type: string
                    psc_stat:
                      type: integer
                  type: object
              type: object
        "400":
          description: 잘못된 idx 또는 구매 요청 불가 대상
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: JWT 인증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "403":
          description: 차단 관계
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "404":
          description: 스토리 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "409":
          description: 취소·회수된 구매
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 조회 또는 저장 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: 스토리 구매 완료
      tags:
      - Story
      x-response-example:
        data:
          msg: ok
          psc_stat: 1
        result: 0
        resultString: Success
  /story/v01/cndt/list/{area}/{stat}/{type}/{order}/{gen}/{page}/{limit}:
    get:
      consumes:
      - application/json
      description: |-
        조건별 스토리 목록 조회 API입니다.

        **요청**: path area/stat/type/order/gen/page/limit. stat: all 또는 pub=0/flw=1/pay=2/prv=3/del=4/rsv=5. type: all 또는 img=0/vdo=1/txt=2/mix=3/rsv=4.

        **처리**: all은 필터 생략이며 저장 enum이 아닙니다. 잘못된 stat/type은 400입니다. txt=2는 미디어 없는 텍스트 글, mix=3은 이미지·동영상 혼합입니다. JWT viewer의 가시성·본문 권한과 활성 cutout 제외를 적용합니다. order: old=오래된순, god=qt_like, cmt=공개 댓글 수, view=qt_view, 나머지=최신순이며 모든 정렬에 idx 보조키를 적용합니다. 조건 피드는 PUB=0, FLW=1, PAY=2와 본인 PRV=3을 조회합니다. 6=all은 상태 필터를 생략하며 삭제·예약 및 타인의 비공개 글은 제외합니다. FLW/PAY는 권한이 없으면 원문을 숨깁니다. gen 파싱 실패 시 1입니다.

        **응답 data**: page, limit, total_count, story(StoryDetailResp 배열).
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 지역 코드 또는 all
        in: path
        name: area
        required: true
        type: string
      - description: '상태: 0=pub, 1=flw, 2=pay, 3=prv, 6=all (문자열 이름도 허용)'
        enum:
        - "0"
        - "1"
        - "2"
        - "3"
        - "6"
        - pub
        - flw
        - pay
        - prv
        - all
        in: path
        name: stat
        required: true
        type: string
      - description: '미디어: all/img/vdo/txt/mix/rsv'
        in: path
        name: type
        required: true
        type: string
      - description: '정렬: new/old/cmt/god/view/rsv'
        in: path
        name: order
        required: true
        type: string
      - description: '성별: 0=여성, 1=남성'
        in: path
        name: gen
        required: true
        type: string
      - description: 페이지 번호(1부터)
        in: path
        name: page
        required: true
        type: integer
      - description: 페이지 크기(1~100)
        in: path
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: total_count, story(StoryDetailResp 배열).'
          schema:
