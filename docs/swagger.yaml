  /story/v01/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        JWT 인증 후 스토리용 미디어만 Cloudflare에 업로드합니다. DB 저장 없이 URL만 반환합니다.

        **용량**: 이미지·썸네일 각 5MB 이하, 동영상(MP4) 각 100MB 이하, files 최대 5개.

        **이미지 전용**: `files`만 전송. 응답 `data.imgs` = filename→URL 맵(JSON).

        **동영상 포함**: `files`의 MP4마다 `thbnl` 썸네일 1장 필수(순서 1:1). 이미지→Images, 동영상→Stream(HLS).
        응답 `data.vdos` = `{"1":"재생URL","thumb1":"썸네일URL",...}` JSON 문자열.
      parameters:
      - description: 미디어 (이미지 JPG/PNG/GIF/WEBP ≤5MB 또는 MP4 ≤100MB, 최대 5개)
        in: formData
        name: files
        required: true
        type: file
      - description: 동영상 썸네일 (이미지 ≤5MB). 동영상 있을 때만 필수, 개수·순서 1:1
        in: formData
        name: thbnl
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: '이미지: {\"msg\":\"ok\",\"imgs\":{...}} / 동영상: {\"msg\":\"ok\",\"vdos\":\"{...}\"}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 파일 없음, 용량 초과, thbnl 불일치 등
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Cloudflare 업로드 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 미디어 업로드 (Cloudflare Images / Stream)
      tags:
      - Story
  /user/v01/getset/{uid}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves notification settings for authenticated users via JWT token.
        Notification settings are managed using bit flags:
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification setting value (0-15)
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespHeader'
            - properties:
                data:
                  type: integer
              type: object
        "401":
          description: Authentication failed - No JWT token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: Get user notification settings
      tags:
      - Setting
  /user/v01/set/{cate}/{value}:
    post:
      consumes:
      - application/json
      description: |-
        Updates user settings based on category. Currently supports notification alert settings.
        Alert settings use bit flags (0-15) with XOR operation to toggle:
        - noti=1 (notification), call=2 (call), msg=4 (message), rvr=8 (reserve)
        - 0 = all alerts enabled
        - 15 = all alerts disabled
        - Example: To toggle notification, send value "1"
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Setting category (e.g. alert)
        in: path
        name: cate
        required: true
        type: string
      - description: Setting value
        in: path
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Setting updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request - Missing or invalid parameters
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: Authentication failed - No JWT token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: Update user settings
      tags:
      - Setting
