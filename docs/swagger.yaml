  /dm/v01/history/{room_id}:
    get:
      consumes:
      - application/json
      description: |-
        특정 채팅방(room_id)의 과거 메시지 목록을 커서 기반으로 페이징하여 조회합니다.
        실시간 신규 메시지는 WebSocket으로 수신하고, 본 API는 과거 구간(기록/이력) 보완용입니다.
        cursor 미지정시 최신 limit개를 반환하며, 이전 응답의 next_cursor를 전달하면 해당 커서보다 오래된 메시지를 조회합니다.
        응답에 my_last_mid / partner_last_mid (Redis DM:READ, TTL 3일) 를 포함합니다. 조회만 하며 mid를 갱신하지 않습니다.

        [요청 예시]
        GET /dm/v01/history/10?limit=20 HTTP/1.1
        GET /dm/v01/history/10?limit=20&cursor=086572 HTTP/1.1
        Authorization: Bearer {access_token}

        [응답 예시]
        {
        "result": 0,
        "resultString": "Success",
        "data": {
        "messages": [...],
        "total_count": 109,
        "next_cursor": "086572",
        "has_more": true,
        "my_last_mid": "mid-aaa",
        "partner_last_mid": "mid-bbb"
        }
        }
      parameters:
      - description: 채팅방 ID
        in: path
        name: room_id
        required: true
        type: string
      - description: '가져올 메시지 개수 (기본값: 20, 최대 pgSize 제한)'
        in: query
        name: limit
        type: integer
      - description: 이전 응답의 next_cursor 값
        in: query
        name: cursor
        type: string
      - description: limit의 최대값 상한 (기본 50)
        in: query
        name: pgSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: messages, total_count, next_cursor, has_more, my_last_mid,
            partner_last_mid
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 잘못된 요청(잘못된 cursor 등)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 방 참여자 아님
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 에러
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 채팅 기록 조회 (커서 페이지네이션)
      tags:
      - chat
  /dm/v01/list/{page}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves the list of direct message chat rooms that the currently authenticated user is participating in. Note: 'userId' query parameter is no longer required or used. Room list is based on the authenticated session.
        request : GET /dm/v01/list/1 HTTP/1.1
        response : {"result":0,"resultString":"Success","data":{"rooms":[{"rid":10,"partner":{"pid":4033287471439576593,"nick":"푸른 아름다운 양","thumb_pic":"https://i.ibb.co/99MhfMXt/icon-male-03.webp","gender":"1","age":"34","area":"서울"},"total":0,"unread":133,"at_crtchat":"2026-04-28T11:43:25Z","at_update":"2026-04-28T11:43:25Z"},{"rid":9,"partner":{"pid":5709326013809104361,"nick":"평화로운 아기 바나나","thumb_pic":"https://i.ibb.co/99MhfMXt/icon-male-03.webp","gender":"1","age":"34","area":"서울"},"total":0,"unread":0,"at_crtchat":"2026-04-20T13:27:53Z","at_update":"2026-04-20T13:27:53Z"}],"total_count":2}}
        목록 정렬: 1) unread>0 방 우선 2) unread 방은 IncrUnread :ts(최근 수신) 3) 그 외 at_update 최신순. page당 10건.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/protocol.DMRoomResp'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get User DM Chat Rooms
      tags:
      - chat
  /dm/v01/mkroom/{pid}:
    post:
      consumes:
      - application/json
      description: 1:1 채팅방(DM)을 생성. 생성된 방의 정보(방 아이디, 파트너 정보, 미확인 메시지 수, 생성/갱신 시각)를
        반환
      parameters:
      - description: pid  partner UID
        in: body
        name: request
        required: true
        schema:
          properties:
            tid:
              type: integer
            uid:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 채팅방 생성 성공 및 방 정보
          schema:
            $ref: '#/definitions/protocol.DMRoomResp'
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: DM create chat room
      tags:
      - chat
  /dm/v01/rinfo/{room_id}:
    get:
      consumes:
      - application/json
      description: |-
        인증된 사용자가 참여 중인 DM 채팅방(room_id = chat_his.idx)의 상세 정보를 조회합니다.
        상대방 프로필, 최근 메시지, 전체/미읽음 메시지 수, 생성·수정 시각을 반환합니다.
        요청자가 방 생성자(uid)이면 tid 사용자 정보를, 초대받은 사용자(tid)이면 uid 사용자 정보를 상대방으로 반환합니다.

        [요청 예시]
        GET /dm/v01/rinfo/10 HTTP/1.1
        Authorization: Bearer {access_token}

        [응답 예시]
        last_msg: txt, img일 경우 'img'로 반환
        {"result":0,"resultString":"Success","data":{"my_last_mid":"m-1783587208891","partner_last_mid":"","room":{"rid":10,"partner":{"pid":4033287471439576593,"nick":"푸른 아름다운 양","thumb_pic":"https://i.ibb.co/99MhfMXt/icon-male-03.webp","gender":"1","age":"34","area":"seoul"},"last_msg":"dfd","partner_left":false,"total":45,"unread":0,"at_crtchat":"2026-04-28T11:43:25Z","at_update":"2026-07-09T08:53:28Z"},"room_id":"10"}}
      parameters:
      - description: 채팅방 ID (chat_his.idx)
        in: path
        name: room_id
        required: true
        type: string
      - description: 방 입장 시 마지막으로 읽은 메시지 mid (없으면 최신 메시지로 갱신)
        in: query
        name: mid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: room_id, room, my_last_mid, partner_last_mid
          schema:
            additionalProperties: true
            type: object
        "400":
          description: room_id 누락
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 에러
          schema:
            additionalProperties:
              type: string
            type: object
      summary: DM 채팅방 단건 조회
      tags:
      - chat
  /dm/v01/rmroom/{room_id}:
