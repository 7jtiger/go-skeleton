  /dm/v01/upload/img:
    post:
      consumes:
      - multipart/form-data
      description: |-
        DM 이미지 업로드 API입니다.

        **요청**: multipart files: 최대 5개, 각 5MiB 이하.

        **처리**: JWT 인증과 simpleImgUploadCF 검증·업로드 후 파일명별 URL을 반환합니다.

        **응답 data**: msg, data(파일명 → URL 맵).
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
        업로드 미들웨어 오류는 JSON 문자열 또는 error 객체일 수 있으며 핸들러의 RespHeader 오류와 형식이 다릅니다.
        **업로드 공통 제한**: 요청 전체 크기·동시 업로드 제한을 초과하면 413/503입니다. 기본값은 530MiB/8건이며 서버 설정에 따라 달라집니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 업로드 파일 (동일 필드명으로 여러 파일 전송 가능)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 'data: msg, data(파일명 → URL 맵).'
          schema:
            $ref: '#/definitions/protocol.RespDataHeader'
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "413":
          description: 업로드 요청 크기 제한 초과
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "503":
          description: 서버 동시 처리·연결 한도 초과
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: DM 이미지 업로드
      tags:
      - DM
      x-response-example:
        data:
          data:
            photo.jpg: https://imagedelivery.net/example/public
          msg: ok
        result: 0
        resultString: Success
