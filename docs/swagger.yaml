  /story/v01/create:
    post:
      consumes:
      - application/json
      description: |
        JWT 인증 사용자의 스토리를 DB에 저장합니다. 미디어 파일은 직접 받지 않고, **업로드 API에서 받은 URL 문자열**을 전달합니다.

        **권장 플로우**
        1. `POST /story/v01/upload` — Cloudflare 업로드 → `data.imgs`(이미지) 또는 `data.vdos`(동영상+썸네일) 수신
        2. `POST /story/v01/create` — 본 API에 JSON body 전달 (`imgs` / `vdos`는 upload 응답 값을 문자열로)

        **stat**: 0=del, 1=pub, 2=private(팔로우공개), 3=limit(유료공개), 4=resv
      parameters:
      - description: 스토리 생성 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.CreateStoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: '성공: {\"msg\":\"ok\",\"idx\":5}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON 파싱 실패, imgs 누락, 프로필 필드 부족
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 저장 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 생성 (미디어 URL + 본문 DB 저장)
      tags:
      - Story
