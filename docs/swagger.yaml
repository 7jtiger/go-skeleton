info:
  contact: {}
  description: ms-gateway API server
  title: ms-gateway API
  version: "1.0"
paths:
  /acc/v01/check/:id:
    get:
      consumes:
      - application/json
      description: |-
        When /acc/v01/check/:id is called, it returns "ok" on success and a message on failure.
        id : user id
      produces:
      - application/json
      responses:
        "14":
          description: 'result: ID is duplicate'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: ok'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'result: request failed'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: check user id
      tags:
      - user
  /acc/v01/ckemail/:email:
    get:
      consumes:
      - application/json
      description: |-
        When /acc/v01/ckemail/:email is called, it returns "ok" on success and a message on failure.
        email : user email
      produces:
      - application/json
      responses:
        "15":
          description: 'result: email is duplicate'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: ok'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'result: request failed'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: check user email
      tags:
      - user
  /acc/v01/cngpw:
    post:
      consumes:
      - application/json
      description: Change the password of a user
      parameters:
      - description: 'Encrypted data by aes256 {id : xxx, uid : xxx, email : xxx,
          pw : hash, newpw : hash}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "109":
          description: Failed to change pw
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Change user password
      tags:
      - user
  /acc/v01/fnid:
    post:
      consumes:
      - application/json
      description: Find user ID by name and birth date
      parameters:
      - description: 'Encrypted data by aes256 GCM mode {name : xxx, birth : 1990-01-01,
          gener : 1}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "111":
          description: Failed to find id
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Find user ID
      tags:
      - user
  /acc/v01/fnpw:
    post:
      consumes:
      - application/json
      description: Find user password by id and birth date
      parameters:
      - description: 'Encrypted data by aes256 {sid : xxx, name: xxx, birth 1990-01-018,
          gender : 1}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: All fields are required
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed Decrypt
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed Parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "112":
          description: Failed to find pw
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'success with {msg : ok, email : xxx}'
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Find user PW
      tags:
      - user
  /acc/v01/login:
    post:
      consumes:
      - application/json
      description: Calls /acc/v01/login to login a user. Returns JWT token, user ID,
        and WebRTC config on success. Also sets x-meta header with user metadata.
      parameters:
      - description: 'Login request data {id : xxx, pw : hash}'
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/protocol.LoginReq'
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed to login user
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: Login success with token, uid, and webrtc config
          headers:
            x-meta:
              description: 'User metadata in format: uid/sid/did/nick/gender/age/area/email/main_pic/thmb_pic/sp_intro'
              type: string
          schema:
            $ref: '#/definitions/protocol.LoginUserResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Login a user
      tags:
      - user
  /acc/v01/refresh:
    post:
      consumes:
      - application/json
      description: Reissues access and refresh token using a valid refresh token.
      parameters:
      - description: Bearer refresh_token
        in: header
        name: Authorization
        type: string
      - description: 'Refresh token payload { refTok: xxx }'
        in: body
        name: data
        schema:
          $ref: '#/definitions/protocol.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  $ref: '#/definitions/protocol.RefreshTokenResp'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: Invalid refresh token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Refresh access token
      tags:
      - user
  /acc/v01/regist:
    post:
      consumes:
      - application/json
      description: |-
        Calls /acc/v01/regist to register a new user. Returns "success" message on success.
        Required fields: id, pw (hashed), name, gender (1=male, 0=female), birth (YYYY-MM-DD format), area, email
        Optional fields: did (device ID), dos (device OS)
        System generates: uid (unique user ID), nick (default nickname), main_pic (default profile image), thmb_pic (default thumbnail), sp_intro (default introduction)
      parameters:
      - description: register request data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.RegistReq'
      produces:
      - application/json
      responses:
        "14":
          description: ID is duplicate
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "15":
          description: Email is duplicate
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed Register User
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Register a new user
      tags:
      - user
  /acc/v01/verifyotp:
    post:
      consumes:
      - application/json
      description: Verify OTP code for authentication
      parameters:
      - description: 'Encrypted data by aes256 {email : xxx, otp : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "116":
          description: Failed to verify OTP
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Verify OTP authentication code
      tags:
      - user
  /account/block/count:
    get:
      description: |-
        Returns the total number of users blocked by the authenticated user.
        요청 예시: GET /account/block/count (Authorization: Bearer)
        응답 예시: {\"result\":0,\"msg\":\"Success\",\"count\":5}
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Blocked user count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: failed to parse uid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: user not found in context
          schema:
            additionalProperties: true
            type: object
        "500":
          description: failed to get block count
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get blocked user count
      tags:
      - account
  /account/v01/favorite/cancel/{tid}:
    post:
      consumes:
      - application/json
      description: |-
        현재 로그인한 사용자가 특정 사용자를 즐겨찾기 목록에서 제거합니다.
        request : POST /account/v01/favorite/cancel/{tid}
        response : {"result":0,"msg":"Success"}
      parameters:
      - description: 즐겨찾기 해제 대상 사용자 uid
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 즐겨찾기 해제
      tags:
      - account
  /account/v01/favorite/set/{tid}:
    post:
      consumes:
      - application/json
      description: |-
        현재 로그인한 사용자가 특정 사용자를 즐겨찾기 목록에 추가합니다.
        request : POST /account/v01/favorite/set/{tid}
        response : {"result":0,"msg":"Success"}
      parameters:
      - description: 즐겨찾기 등록 대상 사용자 uid
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 즐겨찾기 등록
      tags:
      - account
  /account/v01/unblock/{tid}:
    post:
      consumes:
      - application/json
      description: |-
        지정된 상대방(tid)에 대한 차단을 해제합니다. 성공 시 unblock 후 현재 차단 유저수(count)를 반환합니다.
        요청 예시: POST /account/v01/unblock/7
        응답 예시: {"result":0,"msg":"Success","count":2}
      parameters:
      - description: 차단 해제 대상 유저 ID (Target User ID)
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 차단 해제 성공 - result=0, msg=Success, count=차단 유저수
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 잘못된 요청 (tid/uid 변환 오류)
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 (user not found in context)
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 서버 에러 (차단 해제 실패 또는 블록 카운트 조회 실패)
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - Bearer: []
      summary: 차단 해제 (Unblock User)
      tags:
      - Account
  /block/v01/add/{tid}:
    post:
      consumes:
      - application/json
      description: |-
        현재 로그인한 사용자가 대상 사용자를 차단합니다. reason 값이 없으면 "etc"로 처리됩니다.
        요청 예시: POST /block/v01/add/125 Body {\"reason\":\"욕설\"}
        응답 예시: {\"result\":0,\"msg\":\"Success\",\"count\":5}
      parameters:
      - description: 차단할 대상 사용자 ID (target user id)
        in: path
        name: tid
        required: true
        type: string
      - description: 차단 사유 JSON {\
        in: body
        name: reason
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '성공 예시: {\"result\":0, \"msg\":\"Success\", \"count\":5}'
          schema:
            type: object
        "400":
          description: '잘못된 요청(파라미터/바디 오류) 예시: {\"result\":400, \"msg\":\"bad request\"}'
          schema:
            type: object
        "401":
          description: '인증 실패 예시: {\"result\":401, \"msg\":\"unauthorized\"}'
          schema:
            type: object
        "500":
          description: '서버 오류 예시: {\"result\":500, \"msg\":\"internal server error\"}'
          schema:
            type: object
      summary: 사용자 차단하기 (Block a User)
      tags:
      - Account
  /block/v01/list/{page}/{limit}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves the list of users blocked by the authenticated user, with paging.
        요청 예시: GET /block/v01/list/1/10
        응답 예시: {\"result\":0,\"msg\":\"Success\",\"count\":2,\"list\":[...]}
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of results per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'list: blocked user list, count: 총 차단 인원'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 파라미터 오류 혹은 파싱 에러
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 (user not found in context)
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 서버 에러 (차단 리스트 조회 실패)
          schema:
            $ref: '#/definitions/protocol.RespHeader'
