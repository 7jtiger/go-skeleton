        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 대상 인덱스
        in: path
        name: idx
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.msg만 반환합니다. 조회수는 /view/count/{idx}에서 조회합니다.
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  properties:
                    msg:
                      type: string
                  type: object
              type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "404":
          description: 대상 없음 또는 조회 가능한 대상 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: 스토리 조회 이력 갱신
      tags:
      - Story
      x-response-example:
        data:
          msg: ok
        result: 0
        resultString: Success
  /user/v01/getset/{uid}:
    get:
      consumes:
      - application/json
      description: |-
        본인 알림 설정 조회 API입니다.

        **요청**: path uid는 호환용이며 무시합니다.

        **처리**: JWT 본인의 알림 비트 값을 조회합니다.

        **응답 data**: 정수 알림 설정 값.
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 호환용 값. 실제 대상은 JWT 본인
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: 정수 알림 설정 값.'
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  type: integer
              type: object
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: 본인 알림 설정 조회
      tags:
      - Setting
      x-response-example:
        data: 0
        result: 0
        resultString: Success
  /user/v01/set/{cate}/{value}:
    post:
      consumes:
      - application/json
      description: |-
        본인 알림 설정 토글 API입니다.

        **요청**: 실제 입력은 JSON body cate, value(필수 문자열). path cate/value는 무시합니다.

        **처리**: cate는 alert만 허용합니다. value를 정수로 변환하여 기존 알림 값과 XOR하고 저장합니다.

        **응답**: 최상위 msg.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 호환용 값. 실제 입력은 body cate
        in: path
        name: cate
        required: true
        type: string
      - description: 호환용 값. 실제 입력은 body value
        in: path
        name: value
        required: true
        type: string
      - description: '필수 문자열 필드: cate, value'
        in: body
        name: request
        required: true
        schema:
          properties:
            cate:
              type: string
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 최상위 msg.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: 본인 알림 설정 토글
      tags:
      - Setting
      x-request-example:
        cate: alert
        value: "1"
      x-response-example:
        msg: ok
  /webrtc/v01/config:
    get:
      consumes:
      - application/json
      description: |-
        WebRTC 설정 조회 (현재 라우트 제한) API입니다.

        **요청**: 별도 입력 없음. /serv/v01/wsconf와 /webrtc/v01/config는 같은 핸들러입니다.

        **처리**: 현재 두 라우트 모두 JWT 미들웨어가 없어 user 컨텍스트가 설정되지 않으며 401을 반환합니다. 핸들러의 SendResponse도 객체를 허용하지 않아 설정 객체 정상 응답은 구현과 일치하지 않습니다.

        **응답**: 현재 정상 설정 응답 없음. 오류 헤더(result, resultString, desc).
      produces:
      - application/json
      responses:
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: WebRTC 설정 조회 (현재 라우트 제한)
      tags:
      - WebRTC
  /webrtc/v01/ws:
    get:
      consumes:
      - application/json
      description: |-
        WebRTC 시그널링 WebSocket 연결 API입니다.

        **요청**: HTTP Upgrade 후 10초 이내 join-waiting 또는 join 메시지를 전송합니다.

        **처리**: 현재 라우트에 JWT 인증은 없습니다. user_id는 첫 메시지에서 읽습니다. 프로세스 연결 상한 초과 시 503입니다. 수신 프레임 최대 512KiB, 송신 큐 최대 256개/2MiB입니다.

        **응답**: 101 Switching Protocols 이후 WebSocket 메시지로 통신합니다. 첫 메시지 오류는 연결 종료로 처리합니다.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols (WebSocket)
          schema:
            type: string
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            type: string
        "503":
          description: 서버 동시 처리·연결 한도 초과
          schema:
            type: string
      summary: WebRTC 시그널링 WebSocket 연결
      tags:
      - WebRTC
securityDefinitions:
  BearerAuth:
    description: Bearer access_token 형식으로 입력합니다.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
