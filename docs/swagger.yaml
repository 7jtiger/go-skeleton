        **응답 data**: page, limit, total_count, story(StoryDetailResp 배열). 관계 필드 is_locked는 최종 잠금 여부(1=잠김, 0=열림), good_byme는 JWT 사용자의 좋아요 여부(1=좋아요, 0=아님)입니다. is_flwd/is_paid는 글 공개 상태와 별도로 계산합니다.
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 페이지 번호(1부터)
        in: path
        name: page
        required: true
        type: integer
      - description: 페이지 크기(1~100)
        in: path
        name: limit
        required: true
        type: integer
      - description: 대상 UID. 이 파라미터가 없는 목록 경로는 JWT 본인
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: total_count, story(StoryDetailResp 배열). 관계 필드 is_locked는
            최종 잠금 여부(1=잠김, 0=열림), good_byme는 JWT 사용자의 좋아요 여부(1=좋아요, 0=아님)입니다. is_flwd/is_paid는
            글 공개 상태와 별도로 계산합니다.'
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  properties:
                    limit:
                      type: integer
                    page:
                      type: integer
                    story:
                      items:
                        $ref: '#/definitions/protocol.StoryDetailResp'
                      type: array
                    total_count:
                      type: integer
                  type: object
              type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: 작성자별 스토리 목록 조회
      tags:
      - Story
      x-response-example:
        data:
          limit: 10
          page: 1
          story: []
          total_count: 0
        result: 0
        resultString: Success
