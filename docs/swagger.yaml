      summary: 스토리 조회수 조회
      tags:
      - Story
  /story/v01/view/update/{idx}:
    post:
      consumes:
      - application/json
      description: |-
        지정한 스토리(`idx`)의 `qt_view`를 +1 합니다.

        **처리**
        - 대상 행이 없으면 500 (`story not found`)
        - 응답에는 증가 후 조회수 값을 포함하지 않음 (`msg`만 반환)

        **응답 data**: `{"msg":"ok"}`
      parameters:
