  /story/v01/cutout/set/{tid}:
    post:
      consumes:
      - application/json
      description: |-
        JWT 본인이 대상(`tid`)을 스토리 피드에서 숨깁니다. 서비스 전체 차단(`user_block`)과 별개입니다.

        **규칙**
        - JWT uid = cutout 주체, path `tid` = 숨길 대상
        - 자기 자신 cutout 불가 (`self cutout is not allowed`)
        - 대상 미존재/성별 파싱 실패 시 400

        **처리**
        - `GetUserInfoByUID(tid)`로 프로필 스냅샷 조회

        **Request example**
        - POST /story/v01/cutout/set/4033287471439576593
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok","affected":1}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: cutout 대상 사용자 UID
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: msg, affected
          schema:
            $ref: '#/definitions/protocol.CutoutActionResp'
        "400":
          description: tid invalid / self cutout / target user not found / gender
            invalid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: str_cutout 저장 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 cutout 설정
      tags:
      - Story_Cutout
  /story/v01/delpic:
    post:
      consumes:
      - application/json
      description: |-
        스토리 `str_img`에서 지정 슬롯을 제거하고 `str_imgbak`으로 이동한 뒤, 남은 슬롯을 `1..N`으로 재번호합니다.

        **요청 body** (`DeleteStrPicReq`)
        - `idx`: 스토리 인덱스 (문자열 숫자)
        - `pic_idx`: 삭제할 미디어 슬롯 키 (`"1"`~`"5"`)

        **처리**
        1. `GetStrPicList`로 `str_img` / `str_imgbak` 조회
        2. `pic_idx` 슬롯을 bak으로 복사
        3. `ReIdxAfterDel`로 남은 슬롯 재인덱싱
        4. `DeleteStrPic`으로 DB 갱신

        **응답 data**: `{"msg":"ok","affected":N}`
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: idx, pic_idx
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.DeleteStrPicReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg, affected
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON/idx/pic_idx 오류, 빈 목록, 슬롯 없음, str_img 포맷 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 조회/직렬화/DB 갱신 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 미디어 슬롯 삭제
      tags:
      - Story
  /story/v01/detail/{idx}/{page}/{limit}:
    get:
      consumes:
      - application/json
      description: |-
        특정 스토리 idx를 기준으로 해당 작성자(tid)의 스토리를 페이징 조회합니다.

        **조회 대상**
        - `tid` 없음: JWT 본인 UID (`/detail/{idx}/{page}/{limit}`)
        - `tid` 있음: 해당 사용자 UID (`/detail/{idx}/{page}/{limit}/{tid}`)

        **조회 규칙**
        - `uid = tid` 이고 `story.idx <= idx` 인 행을 `idx DESC`로 페이징
        - 각 항목에 최신 댓글 최대 2개(`comment_list`)와 `cmt_count` 포함
