              type: string
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 서버 내부 에러
          schema:
            additionalProperties:
              type: string
            type: object
      summary: DM 채팅방 단건 조회
      tags:
      - chat
