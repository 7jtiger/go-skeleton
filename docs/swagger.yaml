  /story/v01/condition/list/{area}/{stat}/{type}/{order}/{gen}/{page}/{limit}:
    get:
      consumes:
      - application/json
      description: |-
        path 파라미터(area/stat/type/order/gen/page/limit)로 스토리 피드를 조회합니다.

        **필터**
        - `area`: all이면 지역 조건 생략, 그 외 `story.area` 매칭
        - `stat`: pub/flw/pay/prv/del/rsv → story.stat (0~5)
        - `type`: img/vdo/all/rsv — all이면 type 조건 생략
        - `order`: new/old/cmt/god/view/rsv
        - `gen`: 0=여성, 1=남성 (기본 1)

        **cutout**: JWT가 있으면 해당 사용자의 활성 cutout UID를 피드에서 제외

        **응답 data**: `StoryListResp` 배열
        (`idx`, `uid`, `nick`, `stat`, `cnt_count`, `cnt_url`, `cnt_type`, `cnt_thumb`, `at_create`)
      parameters:
      - description: Bearer access token (있으면 cutout 제외 적용)
        in: header
        name: Authorization
        type: string
      - default: all
        description: 지역
        enum:
        - all
        - seoul
        - gyeonggi
        - incheon
        - busan
        - daejeon
        - chungbuk
        - daegu
        - gyeongnam
        - gwangju
        - jeonbuk
        - gangwon
        - jeju
        in: path
        name: area
        required: true
        type: string
      - default: pub
        description: 상태
        enum:
        - pub
        - flw
        - pay
        - prv
        - del
        - rsv
        in: path
        name: stat
        required: true
        type: string
      - default: img
        description: 미디어 타입
        enum:
        - img
        - vdo
        - all
        - rsv
        in: path
        name: type
        required: true
        type: string
      - default: new
        description: 정렬
        enum:
        - new
        - old
        - cmt
        - god
        - view
        - rsv
        in: path
        name: order
        required: true
        type: string
      - default: "1"
        description: 성별 0=여성 1=남성
        enum:
        - "0"
        - "1"
        in: path
        name: gen
        required: true
        type: string
      - description: 페이지 번호(1부터)
        in: path
        name: page
        required: true
        type: integer
      - description: 페이지 크기(기본 4, 최대 100)
        in: path
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: StoryListResp 배열'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: page/limit 잘못된 값
          schema:
            additionalProperties: true
            type: object
        "500":
          description: cutout 조회 실패 또는 리스트 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 조건부 리스트 조회
      tags:
      - Story
  /story/v01/create:
    post:
      consumes:
      - application/json
      description: |-
        JWT 인증 사용자의 스토리를 DB에 저장합니다. 파일 업로드는 하지 않으며, upload API의 `data.media`를 body로 받습니다.

        **권장 플로우**
        1. `POST /story/v01/upload` — Cloudflare 업로드 → `data.media` 수신
        2. `POST /story/v01/create` — JSON body에 `media` 전달 → `SaveStory` INSERT

        **요청 body** (`CreateStoryReq`)
        - `stat`: 0=pub, 1=private(팔로우공개), 2=limit(유료공개), 3=resv, 4=del
        - `sbody`: 본문 (최대 512자)
        - `media`: `StoryStrImg` 슬롯 맵 (1~5개, upload 응답과 동일)
        `{"1":{"type":"img","url":"..."},"2":{"type":"vdo","url":"...","thumb":"..."}}`

        **서버에서 JWT로 채우는 필드**: uid, nick, birth, gender, area
        **검증**: `ValidateStoryMedia` (슬롯·type·url·vdo thumb)
        **저장**: `BuildStrImgForDB`로 `str_img`/`type` 정규화 후 INSERT

        **응답 data**: `{"msg":"ok","idx":<story.idx>}`
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: stat, sbody, media
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.CreateStoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg, idx
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON/media 검증 실패, nick·birth·gender 부족
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 저장 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 생성
      tags:
      - Story
  /story/v01/cutout/cancel/{tid}:
