        "400":
          description: tid invalid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: str_cutout 갱신 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 cutout 해제
