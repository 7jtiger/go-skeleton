      summary: 구매한 스토리 목록 조회
      tags:
      - Story
  /story/v01/prf/assets:
    get:
      consumes:
      - application/json
      description: |-
        JWT 본인의 보유 화살(포인트), 캐시, DM 미읽음 쪽지 합계를 조회합니다.

        **처리**
        - `GetUserAssetInfo(uid)` → `hold_point`, `hold_cash` (NULL이면 0)
        - `GetAllUnreadForUser(uid)` 합산 → `msg_count` (Redis)

        **응답 data**
        - `hold_point`: 보유 화살/포인트
        - `hold_cash`: 보유 캐시
        - `msg_count`: 전체 DM 미읽음 쪽지 합계

        **Request example**
        - GET /story/v01/prf/assets
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"hold_point":0,"hold_cash":0,"msg_count":3}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: hold_point, hold_cash, msg_count
          schema:
            $ref: '#/definitions/protocol.PrfAssetsResp'
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 자산/쪽지 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 프로필 자산 조회
      tags:
      - Profile
  /story/v01/prf/info/{tid}:
    get:
      consumes:
      - application/json
      description: |-
        JWT 인증 후 대상 사용자 프로필(`prf_info`)과 팔로워 수를 조회합니다.

        **조회 대상**
        - path `tid`: 조회할 사용자 UID (본인 조회 시에도 본인 UID 전달)
        - 핸들러상 `tid`가 비어 있으면 JWT 본인 UID 사용

        **처리**
        - `GetPrfInfo(tid)` → `prf_Info`
        - `GetFollowerCount(tid)` → `flw_cnt`

        **응답 data**
        - `prf_Info`: `PrfInfo` (`uid`, `nick`, `gender`, `birth`, `age`, `area`, `intro`, `main_pic`)
        - `flw_cnt`: 팔로워 수

        **Request example**
        - GET /story/v01/prf/info/8697414060736839837
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"flw_cnt":0,"prf_Info":{"uid":8697414060736839837,"nick":"건강한 꼬마 오렌지","gender":"1","birth":"1990-01-01T00:00:00Z","age":"-2","area":"1","intro":"반가워요 큐피톡에서 만나요!","main_pic":""}}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 조회 대상 UID (본인 조회 시에도 UID 전달)
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: prf_Info, flw_cnt
          schema:
            $ref: '#/definitions/protocol.PrfInfoResp'
        "400":
          description: tid 형식 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 프로필/팔로워 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 프로필 정보 조회
      tags:
      - Profile
  /story/v01/prf/pic/delete/{idx}:
    post:
      consumes:
      - application/json
      description: |-
        JWT 인증 사용자의 `prf_info.sub_pic{slot}`를 삭제하고, 뒤 슬롯을 앞으로 당깁니다.

        **idx**(path): 삭제할 슬롯 번호 1~5
        - 예: `2` → sub_pic2 삭제 후 sub_pic3→2, sub_pic4→3, sub_pic5→4, sub_pic5=NULL
        - 슬롯 JSON은 `{"url","stat"}`만 저장(idx 없음). 순번은 컬럼 위치

        **응답**: `SendResponse` → `RespHeader` (`desc=success`, data 필드 없음)

        **Request example**
        - POST /story/v01/prf/pic/delete/2
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","desc":"success"}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 삭제할 프로필 사진 슬롯 (1~5)
        in: path
        name: idx
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: result=0, desc=success
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "400":
          description: idx 누락/형식 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 삭제 실패 (슬롯 범위 포함)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 삭제
      tags:
      - Profile
  /story/v01/prf/pic/list:
    get:
      consumes:
      - application/json
      description: |-
        JWT 인증 후 프로필 사진(`prf_info.sub_pic1`~`sub_pic5`) 목록을 조회합니다.

        **조회 대상**
        - 등록 라우트: `GET /prf/pic/list` → JWT 본인 UID
        - 핸들러상 path `tid`가 있으면 해당 UID 조회 (라우트 미등록 시 본인만)

        **응답 data**: 비어 있지 않은 슬롯만 포함한 `PrfPicMap`
        - 키: `"1"`~`"5"` (`sub_pic` 컬럼 번호)
        - 값: `PrfPicInfo` (`url`, `stat`)

        **PrfPicInfo.stat**: 1=요청중, 2=승인대기, 3=승인, 4=거절/삭제

        **Request example**
        - GET /story/v01/prf/pic/list
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"1":{"url":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/5bca857f-75b1-4548-af93-ffa9fdd05600/public","stat":3},"2":{"url":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/5bca857f-75b1-4548-af93-ffa9fdd05600/public","stat":3}}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: PrfPicMap'
          schema:
            $ref: '#/definitions/protocol.PrfPicListResp'
        "400":
          description: tid 형식 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 프로필 사진 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 목록 조회
      tags:
      - Profile
  /story/v01/prf/pic/stat:
    post:
      consumes:
      - application/json
      description: |-
        승인 대기 목록(`GetPrfPicWaitingList`)의 특정 항목을 승인합니다.
        `prf_info.sub_pic{slot}` JSON의 `stat`을 **3(승인)** 으로 변경합니다.

        **요청 body** (`SetPrfPicStatReq`)
        - `uid`: 대상 사용자 UID (필수, 0 불가)
        - `slot`: sub_pic 슬롯 1~5

        **조건**: 해당 슬롯의 현재 `stat`이 1 또는 2일 때만 갱신

        **응답 data** (`SetPrfPicStatData`)
        - `msg`: `"ok"`
        - `affected`: 갱신 행 수 (0이면 대상 없음/이미 처리됨)

        **Request example**
        - POST /story/v01/prf/pic/stat
        - Header: Authorization: Bearer {access_token}
        - Body: {"uid":8697414060736839837,"slot":1}

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok","affected":1}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 승인 대상 uid + slot
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.SetPrfPicStatReq'
      produces:
      - application/json
      responses:
        "200":
          description: data.msg, data.affected
          schema:
            $ref: '#/definitions/protocol.SetPrfPicStatResp'
        "400":
          description: JSON/uid/slot 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 업데이트 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 승인 (관리자)
      tags:
      - Profile
  /story/v01/prf/pic/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        JWT 인증 사용자의 프로필 사진을 Cloudflare Images에 업로드하고 `prf_info.sub_pic1~5`에 저장합니다.

        **미들웨어**: `ValidateFileUpload(5, 5)` — `files` 최대 5개, 이미지 ≤5MB. 이미지 전용(`thbnl` 첨부 시 400)

        **요청 (multipart/form-data)**
        - `files`: 신규 이미지 (JPG/PNG/GIF/WEBP). 업로드 순서가 슬롯에 반영
        - `urls`: 유지할 기존 사진 URL JSON 배열 문자열. 신규만이면 `[]` (생략 시 `[]`)

        **처리 순서**
        1. `urls` 기존 URL을 앞에서부터 채움 (`stat=3` 승인)
        2. `files` 신규 업로드 URL을 이어 붙임 (`stat=1` 요청중)
        3. 합계 최대 5장 → `sub_pic1`~`sub_picN`에 `{"url","stat"}` JSON 저장 (idx 없음, 나머지 슬롯 NULL)

        **PrfPicInfo.stat**: 1=요청중, 2=승인대기, 3=승인, 4=거절/삭제

        **응답 data**
        - `msg`: `"ok"`
        - `pics`: `[]PrfPicInfo` (url/stat만, 배열 순서=슬롯 1..N)

        **Request example**
        - POST /story/v01/prf/pic/upload
        - Header: Authorization: Bearer {access_token}
        - multipart: files=@a.jpg, files=@b.jpg, urls=["https://imagedelivery.net/.../public"]

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok","pics":[{"url":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/510f55ea-3262-46ba-4fa3-b92c7c738000/public","stat":3},{"url":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/5bca857f-75b1-4548-af93-ffa9fdd05600/public","stat":1}]}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 신규 프로필 이미지 (최대 5개, 이미지 전용)
        in: formData
        name: files
        required: true
        type: file
      - description: '유지할 기존 URL JSON 배열. 예: [] 또는 [\'
        in: formData
        name: urls
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data.msg, data.pics
          schema:
            $ref: '#/definitions/protocol.PrfPicUploadResp'
        "400":
          description: 파일 없음, urls JSON 오류, 저장할 사진 없음, thbnl 첨부
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Cloudflare/DB 저장 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 업로드
      tags:
      - Profile
  /story/v01/prf/pic/waiting/{page}/{limit}:
    get:
      consumes:
      - application/json
      description: |-
        `prf_info.sub_pic1`~`sub_pic5` JSON 중 `stat`이 1(요청중) 또는 2(승인대기)인 항목을 전체 사용자 대상으로 페이징 조회합니다.

        **path**
        - `page`: 페이지 번호 (1부터, `getPageAndLimit`)
        - `limit`: 페이지 크기 (1~100)

        **응답 data** (`PrfPicWaitingListData`)
        - `msg`: `"ok"`
        - `total_count`: 대기 항목 전체 개수
        - `list`: `[]PrfPicWaitingItem` (`uid`, `nick`, `slot`, `url`, `stat`) — `slot`=sub_pic 컬럼 번호

        **PrfPicWaitingItem.stat**: 1=요청중, 2=승인대기

        **Request example**
        - GET /story/v01/prf/pic/waiting/1/20
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok","total_count":2,"list":[{"uid":8697414060736839837,"nick":"건강한 꼬마 오렌지","slot":1,"url":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/5bca857f-75b1-4548-af93-ffa9fdd05600/public","stat":1}]}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 페이지 번호(1부터)
        in: path
        name: page
        required: true
        type: integer
      - description: 페이지 크기(1~100)
        in: path
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.msg, total_count, list
          schema:
            $ref: '#/definitions/protocol.PrfPicWaitingListResp'
        "400":
          description: page/limit 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 승인 대기 목록 (관리자)
      tags:
      - Profile
  /story/v01/prf/set/mainpic/{url}:
    post:
      consumes:
      - application/json
      description: |-
        JWT 인증 사용자의 `prf_info.main_pic`을 설정하거나 삭제합니다.

        **url**(path)
        - 값이 있으면 해당 URL을 대표사진으로 저장 (`IFNULL` → 빈 문자열 허용)
        - 비어 있으면 대표사진 삭제(`main_pic` 빈 문자열)
        - URL에 `/`가 포함되면 path-escape 필수 (예: `url.PathEscape`)

        **응답 data**: `{"msg":"ok"}`

        **Request example (설정)**
        - POST /story/v01/prf/set/mainpic/https%3A%2F%2Fimagedelivery.net%2FbhnuJ7hC7hq1zO__1yxVLg%2F5bca857f-75b1-4548-af93-ffa9fdd05600%2Fpublic
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok"}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 대표사진 URL (PathEscape). 삭제 시 빈 값
        in: path
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data.msg=ok
          schema:
            $ref: '#/definitions/protocol.PrfUpdResp'
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 업데이트 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 대표사진 설정/삭제
      tags:
      - Profile
  /story/v01/prf/story/lists/{tid}:
    get:
      consumes:
      - application/json
      description: |-
        JWT 인증 후 대상 UID의 최신 스토리 최대 4개의 대표 미디어 URL을 조회합니다.

        **조회 대상**
        - 등록 라우트: `GET /prf/story/lists/:tid` → path `tid` UID
        - 핸들러상 `tid`가 비어 있으면 JWT 본인 UID (라우트는 `:tid` 필수)

        **응답 data** (`PrfStoryListsData`)
        - `str_imgs`: 이미지 스토리 대표 URL 맵 (key=story idx, value=URL)
        - `str_thmbls`: 동영상 스토리 썸네일 URL 맵 (key=story idx, value=thumb URL)

        **Request example**
        - GET /story/v01/prf/story/lists/8697414060736839837
        - Header: Authorization: Bearer {access_token}

        **Response example**
        {"result":0,"resultString":"Success","data":{"str_imgs":{"4":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/510f55ea-3262-46ba-4fa3-b92c7c738000/public","5":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/e7b2b58b-a7ec-49a1-5e6d-175e42609b00/public"},"str_thmbls":{"11":"https://imagedelivery.net/bhnuJ7hC7hq1zO__1yxVLg/5bca857f-75b1-4548-af93-ffa9fdd05600/public"}}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 조회 대상 UID (본인 조회 시에도 UID 전달)
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: str_imgs, str_thmbls'
          schema:
            $ref: '#/definitions/protocol.PrfStoryListsResp'
        "400":
          description: tid 형식 오류
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 스토리 목록 조회 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 최근 스토리 대표 이미지 목록
      tags:
      - Profile
  /story/v01/prf/upd:
    post:
      consumes:
      - application/json
      description: |-
        JWT 인증 사용자의 `prf_info`를 부분 수정합니다. UID는 JWT에서 강제 설정합니다.

        **요청 body** (`protocol.PrfInfo`): 값이 있는 필드만 UPDATE (빈 문자열은 무시)
        - 반영 필드: `nick`, `gender`, `age`, `area`, `intro`
        - 미사용: `uid`(JWT 강제), `birth`, `main_pic` (대표사진은 `/prf/set/mainpic`)
        - `area`: 지역명 문자열 → 서버에서 area code로 변환 (`GetAreaCode`)
        - 모든 반영 필드가 비어 있으면 DB UPDATE 없이 성공 응답

        **응답 data**: `{"msg":"ok"}`

        **Request example**
        - POST /story/v01/prf/upd
        - Header: Authorization: Bearer {access_token}
        - Body: {"nick":"prf_test_nick","intro":"프로필 소개 — automated prf test","area":"서울"}

        **Response example**
        {"result":0,"resultString":"Success","data":{"msg":"ok"}}
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 수정할 프로필 필드 (부분 업데이트)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.PrfInfo'
      produces:
      - application/json
      responses:
        "200":
          description: data.msg=ok
          schema:
            $ref: '#/definitions/protocol.PrfUpdResp'
        "400":
          description: JSON 바인딩 실패
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB 업데이트 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 프로필 정보 수정
      tags:
      - Profile
  /story/v01/updbody:
    post:
      consumes:
      - application/json
      description: |-
        지정한 스토리(`idx`)의 본문(`body`)을 갱신합니다.

        **요청 body** (`UpdateStrBodyReq`)
        - `idx`: 스토리 인덱스 (문자열 숫자)
        - `body`: 수정할 본문 (빈 문자열 불가, DB 컬럼 최대 512자)

        **응답 data**: `{"msg":"ok","affected":N}`
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: idx, body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.UpdateStrBodyReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg, affected
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON/idx/body 잘못된 값
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 본문 갱신 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 본문 수정
      tags:
      - Story
  /story/v01/updstat:
    post:
      consumes:
      - application/json
      description: |-
        지정한 스토리(`idx`)의 `stat`을 갱신합니다.

        **요청 body** (`UpdateStrStatReq`)
        - `idx`: 스토리 인덱스 (문자열 숫자)
        - `stat`: 상태 코드 (문자열 숫자)
        0=public, 1=private(팔로우공개), 2=limit(유료공개), 3=rsv, 4=del

        **응답 data**: `{"msg":"ok","affected":N}`
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: idx, stat
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.UpdateStrStatReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg, affected
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON/idx/stat 잘못된 값
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 상태 갱신 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 상태 변경
      tags:
      - Story
  /story/v01/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        JWT 인증 후 스토리용 미디어를 Cloudflare에 업로드하고, DB 저장 없이 통합 `media` 슬롯 맵만 반환합니다.

        **미들웨어**: `ValidateFileUpload(5, 5)` — `files` 최대 5개, 이미지·썸네일 ≤5MB, MP4 ≤100MB

        **요청 (multipart/form-data)**
        - `files`: 이미지(JPG/PNG/GIF/WEBP) 또는 MP4, 업로드 순서가 슬롯 `1..N`
        - `thbnl`: 동영상 썸네일 이미지. MP4마다 1장 필수(개수·순서 1:1)

        **처리**
        - 동영상 포함: Stream/Images 혼합 업로드 + `thbnl` 업로드
        - 이미지만: Images 업로드
        - `BuildStrImgForDB` → `LoadStoryStrImg`로 정규화된 media 응답 (최대 5슬롯)

        **응답 data**
        - `msg`: `"ok"`
        - `media`: `StoryStrImg` 슬롯 맵
        `{"1":{"type":"img","url":"..."},"2":{"type":"vdo","url":"...m3u8","thumb":"..."}}`
        - `type`: `img` | `vdo` / `url`: 본편 / `thumb`: vdo만

        **다음 단계**: 응답 `media`를 `POST /story/v01/create` body에 넣어 스토리 생성
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 미디어 (이미지 ≤5MB 또는 MP4 ≤100MB, 최대 5개)
        in: formData
        name: files
        required: true
        type: file
      - description: 동영상 썸네일 (이미지 ≤5MB). 동영상마다 1장 필수
        in: formData
        name: thbnl
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: msg, media(StoryStrImg)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 파일 없음, thbnl 부족, media 검증 실패
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Cloudflare 업로드 또는 media 구성 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 미디어 업로드 (Cloudflare)
      tags:
      - Story
