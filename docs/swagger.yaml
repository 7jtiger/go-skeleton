  /story/v01/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        스토리 미디어 업로드 (Cloudflare) API입니다.

        **요청**: multipart files: 최대 5개, 이미지·thbnl 각 5MiB 이하, MP4 각 100MiB 이하. 동영상마다 thbnl 이미지가 필요합니다.

        **처리**: ValidateFileUpload(5,5) 검증 후 업로드하고 DB 저장 없이 슬롯 맵을 반환합니다. 현재 UpTotalCldFlr의 동영상 분기는 실제 Stream 업로드 대신 예시 URL을 반환합니다. **현재 제한**: 동영상 업로드 완료를 보장하지 않습니다. 반환 media를 create body로 전달합니다.

        **응답 data**: msg, media. 슬롯 키는 1..5, type은 img/vdo, url은 본편, 동영상 썸네일 JSON 키는 **thumb1**입니다(Go 필드 Thumb).
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
        업로드 미들웨어 오류는 JSON 문자열 또는 error 객체일 수 있으며 핸들러의 RespHeader 오류와 형식이 다릅니다.
        **업로드 공통 제한**: 요청 전체 크기·동시 업로드 제한을 초과하면 413/503입니다. 기본값은 530MiB/8건이며 서버 설정에 따라 달라집니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 업로드 파일 (동일 필드명으로 여러 파일 전송 가능)
        in: formData
        name: files
        required: true
        type: file
      - description: 동영상마다 필수인 썸네일 이미지, 순서 1:1
        in: formData
        name: thbnl
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 'data: msg, media. 슬롯 키는 1..5, type은 img/vdo, url은 본편, 동영상
            썸네일 JSON 키는 **thumb1**입니다(Go 필드 Thumb).'
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  properties:
                    media:
                      $ref: '#/definitions/protocol.StoryStrImg'
                    msg:
                      type: string
                  type: object
              type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "413":
          description: 업로드 요청 크기 제한 초과
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "503":
          description: 서버 동시 처리·연결 한도 초과
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 미디어 업로드 (Cloudflare)
      tags:
      - Story
      x-response-example:
        data:
          media:
            "1":
              type: img
              url: https://imagedelivery.net/example/public
          msg: ok
        result: 0
        resultString: Success
