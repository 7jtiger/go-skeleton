  /fav/v01/list:
    get:
      description: |-
        내가 즐겨찾기한 사용자 목록을 페이지 단위로 조회합니다. (페이지네이션 지원)
        요청 예시: GET /fav/v01/list?page=1&limit=10 (Authorization: Bearer)
        응답 예시: {\"result\":0,\"msg\":\"Success\",\"count\":35,\"list\":[...]}
      parameters:
      - description: 페이지 번호 (기본값 1)
        in: query
        name: page
        type: integer
      - description: 페이지당 항목 수 (기본값 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: result, msg, count, list
          schema:
            additionalProperties: true
