  /story/v01/prf/pic/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        프로필 사진 업로드 API입니다.

        **요청**: multipart files: 신규 이미지, 최대 5개·각 5MiB. urls: 유지할 기존 URL의 JSON 배열 문자열(기본 []).

        **처리**: 신규 파일 업로드 후 기존 URL(stat=3)과 신규 URL(stat=1)을 합쳐 최대 5개 슬롯으로 저장합니다. 파일이 하나 이상 필요합니다.

        **응답 data**: msg, pics.
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
        업로드 미들웨어 오류는 JSON 문자열 또는 error 객체일 수 있으며 핸들러의 RespHeader 오류와 형식이 다릅니다.
        **업로드 공통 제한**: 요청 전체 크기·동시 업로드 제한을 초과하면 413/503입니다. 기본값은 530MiB/8건이며 서버 설정에 따라 달라집니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 업로드 파일 (동일 필드명으로 여러 파일 전송 가능)
        in: formData
        name: files
        required: true
        type: file
      - default: '[]'
        description: 유지할 기존 URL의 JSON 배열 문자열
        in: formData
        name: urls
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: msg, pics.'
          schema:
            $ref: '#/definitions/protocol.PrfPicUploadResp'
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "413":
          description: 업로드 요청 크기 제한 초과
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "503":
          description: 서버 동시 처리·연결 한도 초과
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 프로필 사진 업로드
      tags:
      - Profile
