      responses:
        "200":
          description: msg
          schema:
            additionalProperties: true
            type: object
        "400":
          description: idx 잘못된 값
          schema:
            additionalProperties: true
            type: object
        "401":
          description: JWT 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 스토리 없음 또는 조회수 갱신 실패
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 조회수 증가
      tags:
      - Story
  /user/v01/getset/{uid}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves notification settings for authenticated users via JWT token.
        Notification settings are managed using bit flags:
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification setting value (0-15)
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespHeader'
            - properties:
                data:
                  type: integer
              type: object
        "401":
          description: Authentication failed - No JWT token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: Get user notification settings
      tags:
      - Setting
  /user/v01/set/{cate}/{value}:
    post:
      consumes:
      - application/json
      description: |-
        Updates user settings based on category. Currently supports notification alert settings.
        Alert settings use bit flags (0-15) with XOR operation to toggle:
        - noti=1 (notification), call=2 (call), msg=4 (message), rvr=8 (reserve)
        - 0 = all alerts enabled
        - 15 = all alerts disabled
        - Example: To toggle notification, send value "1"
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Setting category (e.g. alert)
        in: path
        name: cate
        required: true
        type: string
      - description: Setting value
        in: path
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Setting updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request - Missing or invalid parameters
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: Authentication failed - No JWT token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      security:
      - BearerAuth: []
      summary: Update user settings
      tags:
      - Setting
