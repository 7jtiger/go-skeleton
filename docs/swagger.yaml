definitions:
  controller.HomeData:
    properties:
      checkIn:
        type: boolean
      msgQuantity:
        type: integer
      notiNew:
        type: integer
      policyLink:
        type: string
      storyList:
        items:
          $ref: '#/definitions/protocol.Pre7Story'
        type: array
      termsLink:
        type: string
      videoChatList:
        items:
          $ref: '#/definitions/protocol.WTRoomUser'
        type: array
      voiceChatList:
        items:
          $ref: '#/definitions/protocol.WTRoomUser'
        type: array
    type: object
  controller.STUNTestResult:
    properties:
      error:
        type: string
      publicIp:
        type: string
      publicPort:
        type: integer
      responseTime:
        description: ResponseTime time.Duration `json:"responseTime"`
        type: integer
      serverUrl:
        type: string
      success:
        type: boolean
    type: object
  protocol.Announcement:
    properties:
      an_body:
        type: string
      an_title:
        type: string
      an_url:
        type: string
      at_msg:
        type: string
      idx:
        type: integer
      stat:
        type: integer
    type: object
  protocol.AudioConfig:
    properties:
      autoGainControl:
        type: boolean
      echoCancellation:
        type: boolean
      enabled:
        type: boolean
      maxBitrate:
        type: integer
      noiseSuppression:
        type: boolean
    type: object
  protocol.BlockReq:
    properties:
      bid:
        type: string
      reason:
        type: string
      uid:
        type: string
    type: object
  protocol.ChatMessage:
    properties:
      callMode:
        description: video | audio | text
        type: string
      content:
        description: 메시지 내용
        type: string
      from:
        description: 발신자 ID
        type: string
      msgId:
        description: 클라이언트 메시지 식별자
        type: string
      partner:
        allOf:
        - $ref: '#/definitions/protocol.PartnerInfo'
        description: 상대방 정보
      roomId:
        description: 채팅방 ID
        type: string
      timestamp:
        description: 타임스탬프
        type: integer
      to:
        description: 수신자 ID
        type: string
      type:
        description: text-message, typing, read-receipt, call-*
        type: string
      unread:
        description: 읽지 않은 메시지 수
        type: integer
    type: object
  protocol.DMRoomResp:
    properties:
      at_crtchat:
        type: string
      at_update:
        type: string
      partner:
        $ref: '#/definitions/protocol.PartnerInfo'
      rid:
        type: integer
      total:
        type: integer
      unread:
        type: integer
    type: object
  protocol.DeleteStrPicReq:
    properties:
      idx:
        type: string
      pic_idx:
        type: string
    type: object
  protocol.FollowReq:
    properties:
      followee_uid:
        type: string
      follower_uid:
        type: string
    type: object
  protocol.ICEServer:
    properties:
      type:
        description: stun only
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  protocol.LoginReq:
    properties:
      did:
        type: string
      dos:
        type: string
      id:
        type: string
      pw:
        type: string
    type: object
  protocol.LoginUserResp:
    properties:
      acTok:
        type: string
      meta:
        type: string
      msg:
        type: string
      refTok:
        type: string
      uid:
        type: string
      wrtc:
        $ref: '#/definitions/protocol.WebRTCConfig'
    type: object
  protocol.MediaConfig:
    properties:
      audio:
        $ref: '#/definitions/protocol.AudioConfig'
      video:
        $ref: '#/definitions/protocol.VideoConfig'
    type: object
  protocol.Noti:
    properties:
      at_noti:
        type: string
      frm_nick:
        type: string
      frm_uid:
        type: integer
      frm_url:
        type: string
      idx:
        type: integer
      nt_msg:
        type: string
      nt_title:
        type: string
      nt_type:
        type: integer
      stat:
        type: integer
    type: object
  protocol.OkResp:
    properties:
      desc:
        type: string
      result:
        $ref: '#/definitions/protocol.ResultCode'
      resultString:
        type: string
    type: object
  protocol.PartnerInfo:
    properties:
      age:
        type: string
      area:
        type: string
      gender:
        type: string
      nick:
        type: string
      pid:
        type: integer
      thumbPic:
        type: string
    type: object
  protocol.Pre7Story:
    properties:
      idx:
        type: integer
      nick:
        type: string
      pic1:
        type: string
    type: object
  protocol.RefreshTokenReq:
    properties:
      refTok:
        type: string
    type: object
  protocol.RefreshTokenResp:
    properties:
      acTok:
        type: string
      msg:
        type: string
      refTok:
        type: string
      uid:
        type: string
    type: object
  protocol.RegistReq:
    properties:
      age:
        type: string
      area:
        type: string
      birth:
        type: string
      did:
        type: string
      dos:
        type: string
      email:
        type: string
      gender:
        type: string
      id:
        description: key, sid
        type: string
      main_pic:
        type: string
      name:
        type: string
      nick:
        type: string
      pw:
        type: string
      spIntro:
        description: 본인 인삿말
        type: string
      thmb_pic:
        type: string
      uid:
        type: integer
    type: object
  protocol.RespDataHeader:
    properties:
      data: {}
      result:
        $ref: '#/definitions/protocol.ResultCode'
      resultString:
        type: string
    type: object
  protocol.RespHeader:
    properties:
      desc:
        type: string
      result:
        $ref: '#/definitions/protocol.ResultCode'
      resultString:
        type: string
    type: object
  protocol.ResultCode:
    enum:
    - 0
    type: integer
    x-enum-varnames:
    - Success
  protocol.StoryLikeToggleReq:
    properties:
      story_idx:
        type: string
      uid:
        type: string
    type: object
  protocol.StrCmtCreateReq:
    properties:
      body:
        type: string
      nick:
        type: string
      stat:
        type: string
      str_idx:
        type: string
      wuid:
        type: string
    type: object
  protocol.StrCmtUpdBodyReq:
    properties:
      body:
        type: string
      idx:
        type: string
    type: object
  protocol.StrCmtUpdStatReq:
    properties:
      idx:
        type: string
      stat:
        type: string
    type: object
  protocol.UpdateStrBodyReq:
    properties:
      body:
        type: string
      idx:
        type: string
    type: object
  protocol.UpdateStrStatReq:
    properties:
      idx:
        type: string
      stat:
        type: string
    type: object
  protocol.UserInfoResp:
    properties:
      age:
        type: string
      area:
        type: string
      birthday:
        type: string
      did:
        type: string
      email:
        type: string
      gender:
        type: string
      main_pic:
        type: string
      name:
        type: string
      nick:
        type: string
      sid:
        type: string
      sp_intro:
        type: string
      stat:
        type: string
      thmb_pic:
        type: string
      uid:
        type: integer
    type: object
  protocol.VideoConfig:
    properties:
      enabled:
        type: boolean
      frameRate:
        type: integer
      height:
        type: integer
      maxBitrate:
        type: integer
      width:
        type: integer
    type: object
  protocol.WTRoomUser:
    properties:
      age:
        type: string
      area:
        type: string
      did:
        type: string
      gender:
        type: string
      intro:
        type: string
      mainPic:
        type: string
      newStat:
        type: boolean
      nick:
        type: string
      sid:
        type: string
      thumbPic:
        type: string
      uid:
        type: integer
    type: object
  protocol.WebRTCConfig:
    properties:
      iceServers:
        items:
          $ref: '#/definitions/protocol.ICEServer'
        type: array
      mediaSettings:
        $ref: '#/definitions/protocol.MediaConfig'
      signalingServer:
        type: string
      stunServers:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
paths:
  /acc/v01/check/:id:
    get:
      consumes:
      - application/json
      description: |-
        When /acc/v01/check/:id is called, it returns "ok" on success and a message on failure.
        id : user id
      produces:
      - application/json
      responses:
        "14":
          description: 'result: ID is duplicate'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: ok'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'result: request failed'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: check user id
      tags:
      - user
  /acc/v01/ckemail/:email:
    get:
      consumes:
      - application/json
      description: |-
        When /acc/v01/ckemail/:email is called, it returns "ok" on success and a message on failure.
        email : user email
      produces:
      - application/json
      responses:
        "15":
          description: 'result: email is duplicate'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: ok'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'result: request failed'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: check user email
      tags:
      - user
  /acc/v01/cngpw:
    post:
      consumes:
      - application/json
      description: Change the password of a user
      parameters:
      - description: 'Encrypted data by aes256 {id : xxx, uid : xxx, email : xxx,
          pw : hash, newpw : hash}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "109":
          description: Failed to change pw
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Change user password
      tags:
      - user
  /acc/v01/delete/{id}:
    post:
      consumes:
      - application/json
      description: Delete user, but just update user status to 4
      parameters:
      - description: 'Encrypted data by aes256 GCM mode {id : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "115":
          description: Failed to delete user
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Delete user
      tags:
      - user
  /acc/v01/fnid:
    post:
      consumes:
      - application/json
      description: Find user ID by name and birth date
      parameters:
      - description: 'Encrypted data by aes256 GCM mode {name : xxx, birth : 1990-01-01,
          gener : 1}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "111":
          description: Failed to find id
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Find user ID
      tags:
      - user
  /acc/v01/fnpw:
    post:
      consumes:
      - application/json
      description: Find user password by id and birth date
      parameters:
      - description: 'Encrypted data by aes256 {sid : xxx, name: xxx, birth 1990-01-018,
          gender : 1}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: All fields are required
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed Decrypt
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed Parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "112":
          description: Failed to find pw
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'success with {msg : ok, email : xxx}'
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Find user PW
      tags:
      - user
  /acc/v01/info/{id}:
    get:
      consumes:
      - application/json
      description: Get user information
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "114":
          description: Failed to get user info
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: User information
          schema:
            $ref: '#/definitions/protocol.UserInfoResp'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Get user information
      tags:
      - user
  /acc/v01/leave:
    post:
      consumes:
      - application/json
      description: Performs user leave. Returns "success" message on success.
      parameters:
      - description: 'Encrypted data by aes256 GCM mode {id : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "113":
          description: Failed to leave user
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Leave a user
      tags:
      - user
  /acc/v01/login:
    post:
      consumes:
      - application/json
      description: Calls /acc/v01/login to login a user. Returns JWT token, user ID,
        and WebRTC config on success. Also sets x-meta header with user metadata.
      parameters:
      - description: 'Login request data {id : xxx, pw : hash}'
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/protocol.LoginReq'
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed to login user
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: Login success with token, uid, and webrtc config
          headers:
            x-meta:
              description: 'User metadata in format: uid/sid/did/nick/gender/age/area/email/main_pic/thmb_pic/sp_intro'
              type: string
          schema:
            $ref: '#/definitions/protocol.LoginUserResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Login a user
      tags:
      - user
  /acc/v01/logout:
    post:
      consumes:
      - application/json
      description: Logout user
      parameters:
      - description: Bearer access_token
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Logout user
      tags:
      - user
  /acc/v01/modify:
    post:
      consumes:
      - application/json
      description: Modify user information. The 'cate' field should be one of "pw,
        area, nick, email" indicating the target to be changed, and the 'value' field
        should contain the new value for the target.
      parameters:
      - description: 'Encrypted data by aes256 GCM mode {id : xxx, uid : xxx, email
          : xxx, cate : xxx, value : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed to change pw
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Modify user information
      tags:
      - user
  /acc/v01/refresh:
    post:
      consumes:
      - application/json
      description: Reissues access and refresh token using a valid refresh token.
      parameters:
      - description: Bearer refresh_token
        in: header
        name: Authorization
        type: string
      - description: 'Refresh token payload { refTok: xxx }'
        in: body
        name: data
        schema:
          $ref: '#/definitions/protocol.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  $ref: '#/definitions/protocol.RefreshTokenResp'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: Invalid refresh token
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Refresh access token
      tags:
      - user
  /acc/v01/regist:
    post:
      consumes:
      - application/json
      description: |-
        Calls /acc/v01/regist to register a new user. Returns "success" message on success.
        Required fields: id, pw (hashed), name, gender (1=male, 0=female), birth (YYYY-MM-DD format), area, email
        Optional fields: did (device ID), dos (device OS)
        System generates: uid (unique user ID), nick (default nickname), main_pic (default profile image), thmb_pic (default thumbnail), sp_intro (default introduction)
      parameters:
      - description: register request data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.RegistReq'
      produces:
      - application/json
      responses:
        "14":
          description: ID is duplicate
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "15":
          description: Email is duplicate
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "104":
          description: Failed Register User
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'result: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Register a new user
      tags:
      - user
  /acc/v01/reqotp:
    post:
      consumes:
      - application/json
      description: Generate and send OTP code to user's email for authentication
      parameters:
      - description: 'Encrypted data by aes256 {email : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing or invalid
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "116":
          description: Failed to set OTP
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Request OTP authentication code
      tags:
      - user
  /acc/v01/verifyotp:
    post:
      consumes:
      - application/json
      description: Verify OTP code for authentication
      parameters:
      - description: 'Encrypted data by aes256 {email : xxx, otp : xxx}'
        in: body
        name: data
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "102":
          description: Parameter is missing
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "106":
          description: Failed to parse JSON
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "116":
          description: Failed to verify OTP
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "200":
          description: 'msg: success'
          schema:
            $ref: '#/definitions/protocol.OkResp'
        "400":
          description: 'error: error message'
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: Verify OTP authentication code
      tags:
      - user
  /dm/v01/list/{page}:
    get:
      consumes:
      - application/json
      description: 'Retrieves the list of direct message chat rooms that the currently
        authenticated user is participating in. Note: ''userId'' query parameter is
        no longer required or used. Room list is based on the authenticated session.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/protocol.DMRoomResp'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
