        별개이며, 대상 프로필 스냅샷(tnick/tgen/tbirth/tsp_intro/tarea/tthmb_pic)을 str_cutout에
        저장합니다. 자기 자신(tid=본인 uid) cutout은 불가합니다.
      parameters:
      - description: 'Bearer access token. Example: Bearer {access_token}'
        in: header
        name: Authorization
        required: true
        type: string
      - description: cutout 대상 사용자 UID
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: msg, affected
          schema:
            additionalProperties: true
            type: object
        "400":
          description: tid invalid / self cutout / target user not found
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 인증 실패
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 서버 에러
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 스토리 cutout 설정
      tags:
      - Story
