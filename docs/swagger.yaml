  /inserv/v01/upd/mpic:
    post:
      consumes:
      - multipart/form-data
      description: |-
        계정 대표 사진 업로드 (현재 연결 제한) API입니다.

        **요청**: multipart files: 1개·5MiB 이하.

        **처리**: 현재 미들웨어는 upFiles를 설정하지만 핸들러는 uploadedFiles와 sinfo를 기대합니다. 일반 요청은 No files uploaded(400)로 실패하며 정상 업로드 경로가 연결되지 않았습니다.

        **응답**: 현재 정상 업로드 응답 없음. 오류 헤더.
        업로드 미들웨어 오류는 JSON 문자열 또는 error 객체일 수 있으며 핸들러의 RespHeader 오류와 형식이 다릅니다.
        **업로드 공통 제한**: 요청 전체 크기·동시 업로드 제한을 초과하면 413/503입니다. 기본값은 530MiB/8건이며 서버 설정에 따라 달라집니다.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 업로드 파일 (동일 필드명으로 여러 파일 전송 가능)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "401":
          description: 인증 실패 또는 사용자 컨텍스트 없음
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "413":
          description: 업로드 요청 크기 제한 초과
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "503":
          description: 서버 동시 처리·연결 한도 초과
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 계정 대표 사진 업로드 (현재 연결 제한)
      tags:
      - Account
