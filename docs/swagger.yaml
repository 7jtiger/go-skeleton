info:
  contact: {}
  description: |-
    ms-gateway API server. 각 API의 요청 형식, 응답 래퍼 및 현재 구현 제한은 개별 문서를 참고하세요.
    공통 오류 응답은 {"result":1,"resultString":"Failed","msg":"오류 내용"}입니다. 성공 응답의 data 래퍼 유무는 각 엔드포인트 스키마를 따릅니다.
    스토리 상태: 0=PUB, 1=FLW, 2=PAY, 3=PRV, 4=DEL, 5=RSV. 조건 조회는 0/pub, 1/flw, 2/pay, 3/prv, 6/all만 허용하며 6은 저장하지 않습니다.
  title: ms-gateway API
  version: 0.9.1
paths:
  /acc/v01/check/{id}:
    get:
      consumes:
      - application/json
      description: |-
        아이디 중복 확인 API입니다.

        **요청**: path id: 확인할 값.

        **처리**: 사용 가능하면 msg=ok입니다. **현재 제한**: 중복 시 비표준 HTTP 상태 14를 전달하여 net/http 응답 처리에 실패할 수 있습니다. 409 응답으로 구현되어 있지 않습니다.

        **응답**: 사용 가능할 때 최상위 msg.
      parameters:
      - description: 계정 아이디
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 사용 가능할 때 최상위 msg.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "409":
          description: 이미 사용 중인 ID
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: 아이디 중복 확인
      tags:
      - Account
      x-response-example:
        msg: ok
  /acc/v01/ckemail/{email}:
    get:
      consumes:
      - application/json
      description: |-
        이메일 중복 확인 API입니다.

        **요청**: path email: 확인할 값.

        **처리**: 사용 가능하면 msg=ok입니다. **현재 제한**: 중복 시 비표준 HTTP 상태 15를 전달하여 net/http 응답 처리에 실패할 수 있습니다. 409 응답으로 구현되어 있지 않습니다.

        **응답**: 사용 가능할 때 최상위 msg.
      parameters:
      - description: 이메일
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 사용 가능할 때 최상위 msg.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
        "500":
          description: 내부 처리 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: 이메일 중복 확인
      tags:
      - Account
      x-response-example:
        msg: ok
  /acc/v01/cngpw:
    post:
      consumes:
      - application/json
      description: |-
        비밀번호 변경 API입니다.

        **요청**: 일반 JSON body: id, uid, email, pw, newpw (모두 필수 문자열). AES 래퍼를 사용하지 않습니다.

        **처리**: 전달된 계정 정보와 기존 비밀번호로 변경을 처리합니다.

        **응답**: 최상위 msg.
      parameters:
      - description: '필수 문자열 필드: id, uid, email, pw, newpw'
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            id:
              type: string
            newpw:
              type: string
            pw:
              type: string
            uid:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 최상위 msg.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: 비밀번호 변경
      tags:
      - Account
      x-request-example:
        email: user@example.com
        id: example
        newpw: <new-password>
        pw: <current-password>
        uid: "4033287471439576593"
      x-response-example:
        msg: ok
  /acc/v01/fnid:
    post:
      consumes:
      - application/json
      description: |-
        아이디 찾기 API입니다.

        **요청**: 일반 JSON body: name, birth, gender (모두 필수 문자열). AES 래퍼를 사용하지 않습니다.

        **처리**: 입력 정보로 계정을 조회합니다.

        **응답 data**: ids.
        응답은 `{"result":0,"resultString":"Success","data":...}` 형식입니다.
      parameters:
      - description: '필수 문자열 필드: name, birth, gender'
        in: body
        name: request
        required: true
        schema:
          properties:
            birth:
              type: string
            gender:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 아이디 문자열 배열.
          schema:
            allOf:
            - $ref: '#/definitions/protocol.RespDataHeader'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "400":
          description: 요청 형식·값 검증 실패
          schema:
            $ref: '#/definitions/protocol.RespHeader'
      summary: 아이디 찾기
      tags:
      - Account
      x-request-example:
        birth: "1990-01-01"
        gender: "1"
        name: 홍길동
      x-response-example:
        data: []
        result: 0
        resultString: Success
  /acc/v01/fnpw:
    post:
      consumes:
      - application/json
      description: |-
        비밀번호 찾기 API입니다.

        **요청**: 일반 JSON body: sid, name, birth, gender (모두 필수 문자열). AES 래퍼를 사용하지 않습니다.

        **처리**: 입력 정보로 이메일을 조회합니다.

        **응답**: 최상위 msg, email.
      parameters:
      - description: '필수 문자열 필드: sid, name, birth, gender'
        in: body
        name: request
        required: true
        schema:
          properties:
            birth:
              type: string
            gender:
              type: string
            name:
              type: string
            sid:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 최상위 msg, email.
          schema:
            properties:
              email:
                type: string
              msg:
                type: string
            type: object
        "400":
